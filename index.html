<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>FitAI Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: { 50: '#f0f7ff', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' }
          }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { -webkit-tap-highlight-color: transparent; user-select: none; }
  </style>
</head>
<body class="bg-[#f4f5f8] dark:bg-gray-950 text-gray-800 dark:text-gray-100 min-h-screen font-sans pb-10">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // MOTOR COMPLETO DE IA PARA RUTINAS
    const motorIA_GenerarRutina = (datos) => {
      const { objetivo, dias, lesiones, nivel, equipo, duracion } = datos;
      const numDias = parseInt(dias) || 3;

      const baseEjercicios = {
        pecho: ["Press de Banca Plano con Barra", "Press Inclinado con Mancuernas", "Aperturas en Polea Alta"],
        espalda: ["Jalón al Pecho Agarre Ancho", "Remo Horizontal con Barra", "Remo Unilateral con Mancuerna"],
        piernas: lesiones.includes("Espalda baja") 
          ? ["Prensa de Piernas Inclinada", "Hip Thrust con Barra", "Extensión de Cuádriceps", "Curl Femoral Tumbado"]
          : ["Sentadilla Profunda con Barra", "Peso Muerto Rumano", "Hip Thrust con Barra", "Zancadas Búlgaras"],
        hombros: ["Press Militar con Mancuernas", "Elevaciones Laterales", "Pájaro para Deltoides Posterior"],
        brazos: ["Curl de Bíceps con Barra", "Extensión de Tríceps Polea Alta", "Curl Martillo"]
      };

      const plantillasPorDias = [
        { nombre: "Día 1: Torso (Pecho + Espalda + Hombro)", grupos: ['pecho', 'espalda', 'hombros'] },
        { nombre: "Día 2: Pierna Completa & Glúteo", grupos: ['piernas'] },
        { nombre: "Día 3: Fullbody & Brazos", grupos: ['pecho', 'espalda', 'brazos'] },
        { nombre: "Día 4: Hombro & Brazo Focus", grupos: ['hombros', 'brazos'] },
        { nombre: "Día 5: Pierna Cadena Posterior", grupos: ['piernas'] }
      ];

      const diasGenerados = plantillasPorDias.slice(0, numDias).map(p => {
        let ejs = [];
        p.grupos.forEach(grupo => {
          baseEjercicios[grupo].forEach(nombreEj => {
            ejs.push({
              nombre: nombreEj,
              series: nivel === 'Avanzado' ? 4 : 3,
              repsBase: objetivo === 'Fuerza' ? '6-8' : '10-12',
              descansoSeg: objetivo === 'Fuerza' ? 120 : 60
            });
          });
        });
        return {
          nombre: p.nombre,
          ejercicios: ejs.slice(0, duracion === '45 min' ? 4 : 6)
        };
      });

      return {
        usuario: datos.nombre,
        objetivo: datos.objetivo,
        nivel: datos.nivel,
        dias: diasGenerados
      };
    };

    // MOCK DATA SOCIAL
    const INFLUENCERS_MOCK = [
      { id: 'inf-1', nombre: 'Carlos "Titan" Ruiz', handle: '@carlostitan', seguidores: '124K', siguiendo: false, avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop&q=80' },
      { id: 'inf-2', nombre: 'Sofía Fitness Pro', handle: '@sofi_fit', seguidores: '89K', siguiendo: true, avatar: 'https://images.unsplash.com/photo-1517841905240-472988babdf9?w=150&auto=format&fit=crop&q=80' }
    ];

    const POSTS_MOCK = [
      { id: 'p-1', autor: 'Carlos "Titan" Ruiz', avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop&q=80', tiempo: 'Hace 2h', texto: '¡Les dejo un tip clave para el Hip Thrust! Mantengan la mirada al frente durante todo el recorrido.', exclusivo: false, likes: 342 },
      { id: 'p-2', autor: 'Sofía Fitness Pro', avatar: 'https://images.unsplash.com/photo-1517841905240-472988babdf9?w=150&auto=format&fit=crop&q=80', tiempo: 'Hace 5h', texto: '🔒 [RUTINA EXCLUSIVA VIP] Mi circuito semanal hipertrofia de glúteos y femorales cargado para suscriptores.', exclusivo: true, likes: 890 }
    ];

    function App() {
      const [tab, setTab] = useState('generar');
      const [darkMode, setDarkMode] = useState(false);

      // FORMULARIO IA COMPLETO (ORIGINAL)
      const [formData, setFormData] = useState({
        nombre: 'Alan',
        genero: 'Hombre',
        edad: '24',
        estatura: '170',
        objetivo: 'Ganar músculo',
        dias: '3 días',
        equipo: 'Gimnasio completo',
        duracion: '60 min',
        lesiones: 'Espalda baja (Evitar cargas axiales)',
        nivel: 'Intermedio'
      });

      const [loading, setLoading] = useState(false);
      const [rutinaActual, setRutinaActual] = useState(() => {
        try {
          const saved = localStorage.getItem('fitai_rutina');
          return saved ? JSON.parse(saved) : null;
        } catch(e) { return null; }
      });

      // ESTADO CREADOR MANUAL
      const [rutinaNueva, setRutinaNueva] = useState({
        titulo: 'Mi Rutina Personalizada',
        dias: [{ nombre: 'Día 1: Mi Entrenamiento', ejercicios: [] }]
      });
      const [diaSel, setDiaSel] = useState(0);
      const [nuevoEjNombre, setNuevoEjNombre] = useState('');
      const [nuevoEjSeries, setNuevoEjSeries] = useState(3);
      const [nuevoEjReps, setNuevoEjReps] = useState('10-12');

      // ESTADO TIMER AERÓBICO
      const [timerConfig, setTimerConfig] = useState({ prep: 5, trabajo: 45, descanso: 10, rondas: 15 });
      const [timerEstado, setTimerEstado] = useState({ corriendo: false, fase: 'PREPÁRATE', rondaActual: 1, segsFase: 5 });
      const timerTargetRef = useRef(null);

      const [influencers, setInfluencers] = useState(INFLUENCERS_MOCK);

      useEffect(() => {
        if (rutinaActual) localStorage.setItem('fitai_rutina', JSON.stringify(rutinaActual));
      }, [rutinaActual]);

      // SÍNTESIS DE VOZ TIMER
      const hablar = (texto) => {
        if ('speechSynthesis' in window) {
          try {
            window.speechSynthesis.cancel();
            const ut = new SpeechSynthesisUtterance(texto);
            ut.lang = 'es-ES';
            window.speechSynthesis.speak(ut);
          } catch(e){}
        }
      };

      // BUCLE TEMPORIZADOR
      useEffect(() => {
        let interval = null;
        if (timerEstado.corriendo) {
          interval = setInterval(() => {
            const ahora = Date.now();
            const rest = Math.max(0, Math.ceil((timerTargetRef.current - ahora) / 1000));
            setTimerEstado(prev => ({ ...prev, segsFase: rest }));

            if (rest <= 0) {
              if (timerEstado.fase === 'PREPÁRATE') {
                hablar("¡A trabajar!");
                timerTargetRef.current = Date.now() + timerConfig.trabajo * 1000;
                setTimerEstado(prev => ({ ...prev, fase: 'TRABAJO', segsFase: timerConfig.trabajo }));
              } else if (timerEstado.fase === 'TRABAJO') {
                hablar("Descanso");
                timerTargetRef.current = Date.now() + timerConfig.descanso * 1000;
                setTimerEstado(prev => ({ ...prev, fase: 'DESCANSO', segsFase: timerConfig.descanso }));
              } else if (timerEstado.fase === 'DESCANSO') {
                if (timerEstado.rondaActual < timerConfig.rondas) {
                  hablar(`Ronda ${timerEstado.rondaActual + 1}. ¡A trabajar!`);
                  timerTargetRef.current = Date.now() + timerConfig.trabajo * 1000;
                  setTimerEstado(prev => ({
                    ...prev,
                    fase: 'TRABAJO',
                    rondaActual: prev.rondaActual + 1,
                    segsFase: timerConfig.trabajo
                  }));
                } else {
                  hablar("Entrenamiento completado");
                  setTimerEstado(prev => ({ ...prev, corriendo: false, fase: 'COMPLETADO', segsFase: 0 }));
                  clearInterval(interval);
                }
              }
            }
          }, 200);
        }
        return () => clearInterval(interval);
      }, [timerEstado.corriendo, timerEstado.fase, timerEstado.rondaActual, timerConfig]);

      const iniciarTimer = () => {
        hablar(`Prepárate. ${timerConfig.prep} segundos`);
        timerTargetRef.current = Date.now() + timerConfig.prep * 1000;
        setTimerEstado({ corriendo: true, fase: 'PREPÁRATE', rondaActual: 1, segsFase: timerConfig.prep });
      };

      const reiniciarTimer = () => {
        setTimerEstado({ corriendo: false, fase: 'PREPÁRATE', rondaActual: 1, segsFase: timerConfig.prep });
      };

      const aplicarPreset = (prep, trabajo, descanso, rondas) => {
        setTimerConfig({ prep, trabajo, descanso, rondas });
        setTimerEstado({ corriendo: false, fase: 'PREPÁRATE', rondaActual: 1, segsFase: prep });
      };

      const formatearMMSS = (segs) => {
        const m = Math.floor(segs / 60).toString().padStart(2, '0');
        const s = (segs % 60).toString().padStart(2, '0');
        return `${m}:${s}`;
      };

      const calcularTiempoTotalFaltante = () => {
        const rondasRestantes = timerConfig.rondas - timerEstado.rondaActual;
        const porRonda = timerConfig.trabajo + timerConfig.descanso;
        let total = rondasRestantes * porRonda;
        if (timerEstado.fase === 'TRABAJO') total += timerEstado.segsFase + timerConfig.descanso;
        else if (timerEstado.fase === 'DESCANSO') total += timerEstado.segsFase;
        else if (timerEstado.fase === 'PREPÁRATE') total += timerEstado.segsFase + (timerConfig.rondas * porRonda);
        return formatearMMSS(total);
      };

      // GENERAR IA
      const handleGenerarRutina = (e) => {
        e.preventDefault();
        setLoading(true);
        setTimeout(() => {
          const nuevaRutina = motorIA_GenerarRutina(formData);
          setRutinaActual(nuevaRutina);
          setLoading(false);
          setTab('entrenar');
        }, 900);
      };

      // GUARDAR MANUAL
      const guardarRutinaManual = () => {
        setRutinaActual({
          usuario: rutinaNueva.titulo,
          objetivo: 'Personalizado',
          nivel: 'Custom',
          dias: rutinaNueva.dias
        });
        setTab('entrenar');
      };

      return (
        <div className="max-w-md mx-auto p-4 space-y-4">
          
          {/* HEADER */}
          <header className="bg-white dark:bg-gray-900 rounded-3xl p-4 shadow-sm flex justify-between items-center border border-gray-100 dark:border-gray-800">
            <div className="flex items-center space-x-3">
              <div className="w-10 h-10 bg-gradient-to-tr from-blue-600 to-blue-400 text-white font-bold rounded-2xl flex items-center justify-center text-lg shadow-md shadow-blue-500/20">
                F
              </div>
              <h1 className="text-lg font-black text-gray-900 dark:text-white tracking-tight">
                FitAI <span className="text-blue-600">Pro</span>
              </h1>
            </div>
            <button 
              onClick={() => setDarkMode(!darkMode)}
              className="w-10 h-10 bg-gray-100 dark:bg-gray-800 rounded-2xl flex items-center justify-center text-base"
            >
              {darkMode ? '☀️' : '🌙'}
            </button>
          </header>

          {/* NAVEGACIÓN */}
          <nav className="bg-gray-200/70 dark:bg-gray-800/80 p-1.5 rounded-2xl grid grid-cols-5 gap-1 text-[11px] font-bold">
            {['generar', 'entrenar', 'social', 'crear', 'timer'].map(t => (
              <button 
                key={t}
                onClick={() => setTab(t)}
                className={`py-2 rounded-xl capitalize transition-all text-center ${tab === t ? 'bg-white dark:bg-gray-900 text-gray-900 dark:text-white shadow-sm' : 'text-gray-500'}`}
              >
                {t === 'social' ? 'Social' : t}
              </button>
            ))}
          </nav>

          {/* CONTENEDOR PRINCIPAL */}
          <main className="bg-white dark:bg-gray-900 rounded-3xl p-5 shadow-sm border border-gray-100 dark:border-gray-800 space-y-5">
            
            {/* 1. GENERAR CON IA (FORMULARIO ORIGINAL COMPLETO) */}
            {tab === 'generar' && (
              <form onSubmit={handleGenerarRutina} className="space-y-4">
                <div>
                  <h2 className="text-xl font-bold text-gray-900 dark:text-white tracking-tight">Diseña tu Rutina con IA</h2>
                  <p className="text-xs text-gray-400 font-medium leading-relaxed mt-1">La IA analizará tus datos para crear una rutina óptima.</p>
                </div>

                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <label className="block text-[10px] font-bold text-gray-400 tracking-wider uppercase mb-1">Nombre</label>
                    <input 
                      type="text" 
                      value={formData.nombre}
                      onChange={e => setFormData({ ...formData, nombre: e.target.value })}
                      className="w-full p-3 rounded-2xl bg-gray-50 dark:bg-gray-800 border border-transparent dark:border-gray-700 text-xs font-semibold"
                    />
                  </div>
                  <div>
                    <label className="block text-[10px] font-bold text-gray-400 tracking-wider uppercase mb-1">Género</label>
                    <select 
                      value={formData.genero}
                      onChange={e => setFormData({ ...formData, genero: e.target.value })}
                      className="w-full p-3 rounded-2xl bg-gray-50 dark:bg-gray-800 border border-transparent dark:border-gray-700 text-xs font-semibold"
                    >
                      <option value="Hombre">Hombre</option>
                      <option value="Mujer">Mujer</option>
                    </select>
                  </div>
                </div>

                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <label className="block text-[10px] font-bold text-gray-400 tracking-wider uppercase mb-1">Edad</label>
                    <input 
                      type="number" 
                      value={formData.edad}
                      onChange={e => setFormData({ ...formData, edad: e.target.value })}
                      className="w-full p-3 rounded-2xl bg-gray-50 dark:bg-gray-800 border border-transparent dark:border-gray-700 text-xs font-semibold"
                    />
                  </div>
                  <div>
                    <label className="block text-[10px] font-bold text-gray-400 tracking-wider uppercase mb-1">Estatura (cm)</label>
                    <input 
                      type="number" 
                      value={formData.estatura}
                      onChange={e => setFormData({ ...formData, estatura: e.target.value })}
                      className="w-full p-3 rounded-2xl bg-gray-50 dark:bg-gray-800 border border-transparent dark:border-gray-700 text-xs font-semibold"
                    />
                  </div>
                </div>

                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <label className="block text-[10px] font-bold text-gray-400 tracking-wider uppercase mb-1">Objetivo</label>
                    <select 
                      value={formData.objetivo}
                      onChange={e => setFormData({ ...formData, objetivo: e.target.value })}
                      className="w-full p-3 rounded-2xl bg-gray-50 dark:bg-gray-800 border border-transparent dark:border-gray-700 text-xs font-semibold"
                    >
                      <option value="Ganar músculo">Ganar músculo</option>
                      <option value="Perder grasa">Perder grasa</option>
                      <option value="Fuerza">Fuerza</option>
                    </select>
                  </div>
                  <div>
                    <label className="block text-[10px] font-bold text-gray-400 tracking-wider uppercase mb-1">Días por semana</label>
                    <select 
                      value={formData.dias}
                      onChange={e => setFormData({ ...formData, dias: e.target.value })}
                      className="w-full p-3 rounded-2xl bg-gray-50 dark:bg-gray-800 border border-transparent dark:border-gray-700 text-xs font-semibold"
                    >
                      <option value="2 días">2 días</option>
                      <option value="3 días">3 días</option>
                      <option value="4 días">4 días</option>
                      <option value="5 días">5 días</option>
                    </select>
                  </div>
                </div>

                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <label className="block text-[10px] font-bold text-gray-400 tracking-wider uppercase mb-1">Equipo Disponible</label>
                    <select 
                      value={formData.equipo}
                      onChange={e => setFormData({ ...formData, equipo: e.target.value })}
                      className="w-full p-3 rounded-2xl bg-gray-50 dark:bg-gray-800 border border-transparent dark:border-gray-700 text-xs font-semibold"
                    >
                      <option value="Gimnasio completo">Gimnasio completo</option>
                      <option value="Mancuernas">Mancuernas</option>
                      <option value="Calistenia">Calistenia</option>
                    </select>
                  </div>
                  <div>
                    <label className="block text-[10px] font-bold text-gray-400 tracking-wider uppercase mb-1">Duración Sesión</label>
                    <select 
                      value={formData.duracion}
                      onChange={e => setFormData({ ...formData, duracion: e.target.value })}
                      className="w-full p-3 rounded-2xl bg-gray-50 dark:bg-gray-800 border border-transparent dark:border-gray-700 text-xs font-semibold"
                    >
                      <option value="45 min">45 min</option>
                      <option value="60 min">60 min</option>
                    </select>
                  </div>
                </div>

                <div>
                  <label className="block text-[10px] font-bold text-gray-400 tracking-wider uppercase mb-1">Lesiones / Limitaciones</label>
                  <select 
                    value={formData.lesiones}
                    onChange={e => setFormData({ ...formData, lesiones: e.target.value })}
                    className="w-full p-3 rounded-2xl bg-gray-50 dark:bg-gray-800 border border-transparent dark:border-gray-700 text-xs font-semibold"
                  >
                    <option value="Espalda baja (Evitar cargas axiales)">Espalda baja (Evitar cargas axiales)</option>
                    <option value="Rodillas (Evitar gran flexión)">Rodillas (Evitar gran flexión)</option>
                    <option value="Sin lesiones">Sin lesiones</option>
                  </select>
                </div>

                <div>
                  <label className="block text-[10px] font-bold text-gray-400 tracking-wider uppercase mb-1">Nivel</label>
                  <select 
                    value={formData.nivel}
                    onChange={e => setFormData({ ...formData, nivel: e.target.value })}
                    className="w-full p-3 rounded-2xl bg-gray-50 dark:bg-gray-800 border border-transparent dark:border-gray-700 text-xs font-semibold"
                  >
                    <option value="Principiante">Principiante</option>
                    <option value="Intermedio">Intermedio</option>
                    <option value="Avanzado">Avanzado</option>
                  </select>
                </div>

                <button 
                  type="submit" 
                  disabled={loading}
                  className="w-full py-4 bg-gradient-to-r from-blue-700 to-blue-600 hover:from-blue-800 text-white font-black uppercase tracking-wider rounded-2xl text-xs shadow-lg shadow-blue-600/30 transition-all mt-2"
                >
                  {loading ? 'PROCESANDO CON IA...' : 'GENERAR RUTINA CON IA'}
                </button>
              </form>
            )}

            {/* 2. ENTRENAR */}
            {tab === 'entrenar' && (
              <div className="space-y-4">
                {!rutinaActual ? (
                  <div className="text-center py-10 text-gray-400 text-xs">
                    Aún no tienes rutina guardada. Usa <span className="font-bold text-blue-600">Generar</span> o <span className="font-bold text-blue-600">Crear</span>.
                  </div>
                ) : (
                  <div className="space-y-4">
                    <div className="flex justify-between items-center">
                      <div>
                        <h3 className="font-extrabold text-base text-gray-900 dark:text-white">Rutina: {rutinaActual.usuario}</h3>
                        <p className="text-[10px] text-gray-400">Objetivo: {rutinaActual.objetivo}</p>
                      </div>
                      <span className="px-2.5 py-1 bg-blue-100 dark:bg-blue-900/50 text-blue-600 dark:text-blue-300 font-bold text-[10px] rounded-lg">
                        {rutinaActual.nivel}
                      </span>
                    </div>

                    {rutinaActual.dias.map((dia, diaIdx) => (
                      <div key={diaIdx} className="bg-gray-50 dark:bg-gray-800/50 p-4 rounded-2xl border border-gray-100 dark:border-gray-700 space-y-3">
                        <h4 className="font-bold text-xs text-blue-600">{dia.nombre}</h4>
                        <div className="space-y-2">
                          {dia.ejercicios.map((ej, ejIdx) => (
                            <div key={ejIdx} className="bg-white dark:bg-gray-800 p-2.5 rounded-xl text-xs flex justify-between items-center shadow-sm">
                              <span className="font-semibold text-gray-800 dark:text-gray-100">{ej.nombre}</span>
                              <span className="text-gray-400 text-[10px]">{ej.series} series × {ej.repsBase} reps</span>
                            </div>
                          ))}
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            {/* 3. SOCIAL */}
            {tab === 'social' && (
              <div className="space-y-4">
                <div>
                  <h2 className="text-lg font-extrabold text-gray-900 dark:text-white">Comunidad Fitness</h2>
                  <p className="text-xs text-gray-400">Sigue a tus creadores favoritos y entrena con sus rutinas.</p>
                </div>

                <div className="flex space-x-3 overflow-x-auto pb-2">
                  {influencers.map(inf => (
                    <div key={inf.id} className="min-w-[130px] bg-gray-50 dark:bg-gray-800 p-3 rounded-2xl border border-gray-100 dark:border-gray-700 flex flex-col items-center text-center space-y-2">
                      <img src={inf.avatar} className="w-10 h-10 rounded-full object-cover" />
                      <div>
                        <p className="font-bold text-xs truncate max-w-[100px]">{inf.nombre}</p>
                        <p className="text-[10px] text-gray-400">{inf.seguidores}</p>
                      </div>
                      <button 
                        onClick={() => setInfluencers(prev => prev.map(i => i.id === inf.id ? { ...i, siguiendo: !i.siguiendo } : i))}
                        className={`w-full py-1 rounded-xl text-[10px] font-bold ${inf.siguiendo ? 'bg-gray-200 text-gray-700' : 'bg-blue-600 text-white'}`}
                      >
                        {inf.siguiendo ? 'Siguiendo' : 'Seguir'}
                      </button>
                    </div>
                  ))}
                </div>

                <div className="space-y-3">
                  {POSTS_MOCK.map(post => (
                    <div key={post.id} className="p-3.5 rounded-2xl bg-gray-50 dark:bg-gray-800 border border-gray-100 dark:border-gray-700 space-y-2">
                      <div className="flex items-center space-x-2">
                        <img src={post.avatar} className="w-8 h-8 rounded-full object-cover" />
                        <div>
                          <p className="font-bold text-xs">{post.autor}</p>
                          <p className="text-[9px] text-gray-400">{post.tiempo}</p>
                        </div>
                      </div>
                      <p className="text-xs text-gray-700 dark:text-gray-300">{post.texto}</p>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* 4. CREAR (CREADOR MANUAL DE RUTINAS) */}
            {tab === 'crear' && (
              <div className="space-y-4">
                <div>
                  <h2 className="text-lg font-extrabold text-gray-900 dark:text-white">Crear Rutina Manual</h2>
                  <p className="text-xs text-gray-400">Diseña tu plan personalizado agregando días y ejercicios.</p>
                </div>

                <div>
                  <label className="block text-[10px] font-bold text-gray-400 uppercase mb-1">Nombre de la Rutina</label>
                  <input 
                    type="text" 
                    value={rutinaNueva.titulo}
                    onChange={e => setRutinaNueva({ ...rutinaNueva, titulo: e.target.value })}
                    className="w-full p-3 rounded-2xl bg-gray-50 dark:bg-gray-800 border border-transparent dark:border-gray-700 text-xs font-semibold"
                  />
                </div>

                <div className="space-y-2">
                  <div className="flex justify-between items-center">
                    <span className="text-xs font-bold text-gray-400 uppercase">Días</span>
                    <button 
                      onClick={() => setRutinaNueva(p => ({ ...p, dias: [...p.dias, { nombre: `Día ${p.dias.length + 1}`, ejercicios: [] }] }))} 
                      className="text-xs font-bold text-blue-600"
                    >
                      + Añadir Día
                    </button>
                  </div>
                  <div className="flex space-x-2 overflow-x-auto pb-1">
                    {rutinaNueva.dias.map((d, idx) => (
                      <button 
                        key={idx} 
                        onClick={() => setDiaSel(idx)}
                        className={`px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap ${diaSel === idx ? 'bg-blue-600 text-white' : 'bg-gray-100 dark:bg-gray-800 text-gray-500'}`}
                      >
                        {d.nombre}
                      </button>
                    ))}
                  </div>
                </div>

                <div className="bg-gray-50 dark:bg-gray-800/60 p-3.5 rounded-2xl border border-gray-100 dark:border-gray-700 space-y-2.5">
                  <span className="text-xs font-bold">Añadir ejercicio a {rutinaNueva.dias[diaSel]?.nombre}</span>
                  <input 
                    type="text" 
                    placeholder="Ej: Sentadilla con barra..." 
                    value={nuevoEjNombre} 
                    onChange={e => setNuevoEjNombre(e.target.value)}
                    className="w-full p-2.5 rounded-xl bg-white dark:bg-gray-800 text-xs border border-transparent dark:border-gray-700"
                  />
                  <div className="grid grid-cols-2 gap-2">
                    <input 
                      type="number" 
                      placeholder="Series" 
                      value={nuevoEjSeries} 
                      onChange={e => setNuevoEjSeries(e.target.value)}
                      className="p-2 rounded-xl bg-white dark:bg-gray-800 text-xs border border-transparent dark:border-gray-700"
                    />
                    <input 
                      type="text" 
                      placeholder="Reps" 
                      value={nuevoEjReps} 
                      onChange={e => setNuevoEjReps(e.target.value)}
                      className="p-2 rounded-xl bg-white dark:bg-gray-800 text-xs border border-transparent dark:border-gray-700"
                    />
                  </div>
                  <button 
                    onClick={() => {
                      if (!nuevoEjNombre) return;
                      const c = [...rutinaNueva.dias];
                      c[diaSel].ejercicios.push({ nombre: nuevoEjNombre, series: nuevoEjSeries, repsBase: nuevoEjReps });
                      setRutinaNueva({ ...rutinaNueva, dias: c });
                      setNuevoEjNombre('');
                    }}
                    className="w-full py-2 bg-gray-900 dark:bg-gray-700 text-white font-bold rounded-xl text-xs"
                  >
                    + Agregar Ejercicio
                  </button>
                </div>

                <div className="space-y-1.5">
                  {rutinaNueva.dias[diaSel]?.ejercicios.map((ej, idx) => (
                    <div key={idx} className="flex justify-between p-2.5 bg-gray-50 dark:bg-gray-800 rounded-xl text-xs">
                      <span className="font-semibold">{ej.nombre}</span>
                      <span className="text-gray-400">{ej.series} × {ej.repsBase}</span>
                    </div>
                  ))}
                </div>

                <button 
                  onClick={guardarRutinaManual}
                  className="w-full py-3.5 bg-blue-600 text-white font-bold rounded-2xl text-xs uppercase"
                >
                  GUARDAR Y ENTRENAR
                </button>
              </div>
            )}

            {/* 5. TIMER AERÓBICO (ESTILO EXACTO A TU IMAGEN) */}
            {tab === 'timer' && (
              <div className="space-y-4">
                <div>
                  <h2 className="text-2xl font-black text-purple-600 dark:text-purple-400">Timer aeróbico</h2>
                  <p className="text-xs text-gray-400 mt-0.5">Intervalos de trabajo y descanso con aviso sonoro y de voz.</p>
                </div>

                {/* CARD TIMER */}
                <div className="bg-gray-50 dark:bg-gray-950 border border-gray-200 dark:border-gray-800 rounded-3xl p-6 text-center space-y-1 shadow-inner">
                  <span className="text-xs font-black tracking-widest uppercase text-gray-400">
                    {timerEstado.fase}
                  </span>
                  <div className="text-6xl font-black tracking-tight text-gray-900 dark:text-white font-mono py-1">
                    {formatearMMSS(timerEstado.segsFase)}
                  </div>
                  <p className="text-xs text-gray-400 font-medium">
                    Faltan {calcularTiempoTotalFaltante()}
                  </p>
                  <div className="w-full bg-gray-200 dark:bg-gray-800 h-1.5 rounded-full overflow-hidden mt-3">
                    <div 
                      className="bg-purple-600 h-full transition-all duration-200"
                      style={{
                        width: `${
                          timerEstado.fase === 'TRABAJO' 
                            ? ((timerConfig.trabajo - timerEstado.segsFase) / timerConfig.trabajo) * 100 
                            : timerEstado.fase === 'DESCANSO' 
                            ? ((timerConfig.descanso - timerEstado.segsFase) / timerConfig.descanso) * 100 
                            : 100
                        }%`
                      }}
                    ></div>
                  </div>
                </div>

                {/* BOTONES */}
                <div className="grid grid-cols-3 gap-3">
                  <button 
                    onClick={iniciarTimer}
                    className="col-span-2 py-3.5 bg-purple-600 hover:bg-purple-700 text-white font-bold rounded-2xl text-xs shadow-lg shadow-purple-600/30 transition-all active:scale-[0.98]"
                  >
                    {timerEstado.corriendo ? "Pausar / Reiniciar" : "Iniciar"}
                  </button>
                  <button 
                    onClick={reiniciarTimer}
                    className="py-3.5 bg-gray-100 dark:bg-gray-800 text-gray-800 dark:text-white font-bold rounded-2xl text-xs transition-all active:scale-[0.98]"
                  >
                    Reiniciar
                  </button>
                </div>

                {/* MODELOS Y ENTRADAS */}
                <div className="bg-gray-50 dark:bg-gray-800/40 border border-gray-100 dark:border-gray-800 rounded-3xl p-4 space-y-3">
                  <span className="text-xs font-extrabold text-gray-400 uppercase tracking-wider block">Modelos</span>
                  
                  <div className="flex flex-wrap gap-2">
                    <button onClick={() => aplicarPreset(5, 45, 10, 15)} className="px-3 py-1.5 rounded-xl bg-white dark:bg-gray-800 text-xs font-bold shadow-sm">
                      45/10/15
                    </button>
                    <button onClick={() => aplicarPreset(5, 20, 10, 8)} className="px-3 py-1.5 rounded-xl bg-white dark:bg-gray-800 text-xs font-bold shadow-sm">
                      Tabata
                    </button>
                    <button onClick={() => aplicarPreset(5, 30, 30, 10)} className="px-3 py-1.5 rounded-xl bg-white dark:bg-gray-800 text-xs font-bold shadow-sm">
                      HIIT 30/30
                    </button>
                    <button onClick={() => aplicarPreset(5, 60, 30, 20)} className="px-3 py-1.5 rounded-xl bg-white dark:bg-gray-800 text-xs font-bold shadow-sm">
                      Cardio 20 min
                    </button>
                  </div>

                  <div className="grid grid-cols-2 gap-2 pt-1">
                    <div>
                      <label className="block text-[10px] font-bold text-gray-400 uppercase mb-1">Trabajo (seg)</label>
                      <input 
                        type="number" 
                        value={timerConfig.trabajo}
                        onChange={e => setTimerConfig({ ...timerConfig, trabajo: parseInt(e.target.value) || 0 })}
                        className="w-full p-2.5 rounded-xl bg-white dark:bg-gray-800 border border-gray-100 dark:border-gray-700 text-xs font-bold"
                      />
                    </div>
                    <div>
                      <label className="block text-[10px] font-bold text-gray-400 uppercase mb-1">Descanso (seg)</label>
                      <input 
                        type="number" 
                        value={timerConfig.descanso}
                        onChange={e => setTimerConfig({ ...timerConfig, descanso: parseInt(e.target.value) || 0 })}
                        className="w-full p-2.5 rounded-xl bg-white dark:bg-gray-800 border border-gray-100 dark:border-gray-700 text-xs font-bold"
                      />
                    </div>
                  </div>
                </div>
              </div>
            )}

          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
