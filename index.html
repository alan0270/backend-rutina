<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Hevy Pro Clone</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            hevyBlue: '#1a6dff',
            hevyBg: '#0f172a',
            hevyCard: '#1e293b',
            hevyInput: '#334155'
          }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; }
    input[type="number"]::-webkit-inner-spin-button, 
    input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen pb-28">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // TIPOS DE SERIE AL ESTILO HEVY
    const SET_TYPES = {
      W: { label: 'Calentamiento', tag: 'W', color: 'text-amber-400 bg-amber-400/10' },
      N: { label: 'Normal', tag: '1', color: 'text-gray-400 bg-gray-800' },
      D: { label: 'Drop Set', tag: 'D', color: 'text-purple-400 bg-purple-400/10' },
      F: { label: 'Fallo', tag: 'F', color: 'text-red-400 bg-red-400/10' }
    };

    function App() {
      const [tab, setTab] = useState('entrenar');
      const [sesionActiva, setSesionActiva] = useState(() => {
        try { return JSON.parse(localStorage.getItem('hevy_sesion_activa')) || null; } catch(e) { return null; }
      });
      const [historial, setHistorial] = useState(() => {
        try { return JSON.parse(localStorage.getItem('hevy_historial')) || []; } catch(e) { return []; }
      });

      useEffect(() => {
        try { localStorage.setItem('hevy_sesion_activa', JSON.stringify(sesionActiva)); } catch(e){}
      }, [sesionActiva]);

      useEffect(() => {
        try { localStorage.setItem('hevy_historial', JSON.stringify(historial)); } catch(e){}
      }, [historial]);

      // INICIAR ENTRENAMIENTO
      const iniciarEntrenamientoVacio = () => {
        setSesionActiva({
          titulo: 'Entrenamiento de Tarde',
          inicio: new Date().toISOString(),
          ejercicios: [
            {
              id: 'press_banca',
              nombre: 'Press de Banca Plano con Barra',
              musculo: 'Pecho',
              historialAnterior: '40 kg × 10 reps',
              series: [
                { tipo: 'W', kg: '', reps: '', completado: false },
                { tipo: 'N', kg: '', reps: '', completado: false },
                { tipo: 'N', kg: '', reps: '', completado: false }
              ]
            }
          ]
        });
      };

      const agregarEjercicio = () => {
        if (!sesionActiva) return;
        const nuevo = {
          id: Date.now().toString(),
          nombre: 'Sentadilla con Barra',
          musculo: 'Piernas',
          historialAnterior: '60 kg × 8 reps',
          series: [
            { tipo: 'N', kg: '', reps: '', completado: false },
            { tipo: 'N', kg: '', reps: '', completado: false }
          ]
        };
        setSesionActiva({ ...sesionActiva, ejercicios: [...sesionActiva.ejercicios, nuevo] });
      };

      const agregarSerie = (ejIdx) => {
        const actual = { ...sesionActiva };
        actual.ejercicios[ejIdx].series.push({ tipo: 'N', kg: '', reps: '', completado: false });
        setSesionActiva(actual);
      };

      const toggleCompletado = (ejIdx, setIdx) => {
        const actual = { ...sesionActiva };
        const s = actual.ejercicios[ejIdx].series[setIdx];
        s.completado = !s.completado;
        if (s.completado && navigator.vibrate) navigator.vibrate(15);
        setSesionActiva(actual);
      };

      const finalizarEntrenamiento = () => {
        if (!sesionActiva) return;
        let totalVolumen = 0;
        let totalReps = 0;

        sesionActiva.ejercicios.forEach(ej => {
          ej.series.forEach(s => {
            if (s.completado && s.kg && s.reps) {
              totalVolumen += (parseFloat(s.kg) * parseInt(s.reps));
              totalReps += parseInt(s.reps);
            }
          });
        });

        const guardado = {
          ...sesionActiva,
          fin: new Date().toISOString(),
          volumenTotal: totalVolumen,
          repsTotales: totalReps
        };

        setHistorial([guardado, ...historial]);
        setSesionActiva(null);
        setTab('perfil');
      };

      return (
        <div className="max-w-md mx-auto px-4 pt-4">
          
          {/* TOP BAR */}
          <header className="flex justify-between items-center py-3 border-b border-gray-800 mb-4">
            <h1 className="text-xl font-black text-blue-500 tracking-tight">HEVY <span className="text-white text-xs font-bold uppercase bg-blue-600/20 px-2 py-0.5 rounded-md ml-1">PRO</span></h1>
            {sesionActiva && (
              <button onClick={finalizarEntrenamiento} className="bg-green-600 hover:bg-green-500 text-white font-extrabold text-xs px-4 py-2 rounded-lg uppercase tracking-wider">
                Finalizar
              </button>
            )}
          </header>

          {/* VISTA 1: REGISTRO TIPO HEVY */}
          {tab === 'entrenar' && (
            <div className="space-y-6">
              {!sesionActiva ? (
                <div className="space-y-4 text-center py-10">
                  <div className="w-16 h-16 bg-blue-600/10 rounded-full flex items-center justify-center mx-auto text-blue-500 text-2xl font-black">🏋️</div>
                  <h2 className="text-lg font-bold">Comenzar Entrenamiento</h2>
                  <p className="text-xs text-gray-400">Registra tus series, peso y repeticiones en tiempo real.</p>
                  <button onClick={iniciarEntrenamientoVacio} className="w-full py-3.5 bg-blue-600 text-white font-extrabold rounded-xl text-xs uppercase tracking-wider shadow-lg shadow-blue-500/20">
                    + Iniciar Entrenamiento Vacío
                  </button>
                </div>
              ) : (
                <div className="space-y-6">
                  <input 
                    type="text" 
                    value={sesionActiva.titulo} 
                    onChange={e => setSesionActiva({...sesionActiva, titulo: e.target.value})}
                    className="w-full bg-transparent text-xl font-black text-white outline-none border-b border-gray-800 pb-2"
                  />

                  {/* LISTA DE EJERCICIOS */}
                  {sesionActiva.ejercicios.map((ej, ejIdx) => (
                    <div key={ej.id} className="bg-gray-900 border border-gray-800 rounded-2xl p-4 space-y-3">
                      <div className="flex justify-between items-start">
                        <div>
                          <h3 className="font-bold text-sm text-blue-400">{ej.nombre}</h3>
                          <p className="text-[10px] text-gray-500 uppercase font-bold">Anterior: {ej.historialAnterior}</p>
                        </div>
                      </div>

                      {/* TABLA DE SERIES ESTILO HEVY */}
                      <div className="space-y-2">
                        <div className="grid grid-cols-12 text-[10px] font-black text-gray-500 uppercase text-center">
                          <span className="col-span-2">SET</span>
                          <span className="col-span-4">KG</span>
                          <span className="col-span-4">REPS</span>
                          <span className="col-span-2">✓</span>
                        </div>

                        {ej.series.map((s, setIdx) => (
                          <div key={setIdx} className={`grid grid-cols-12 gap-2 items-center p-1.5 rounded-xl transition-colors ${s.completado ? 'bg-green-950/20 border border-green-500/20' : 'bg-gray-800/50'}`}>
                            
                            {/* TIPO DE SERIE */}
                            <button className={`col-span-2 font-black text-xs py-1 rounded-md text-center ${SET_TYPES[s.tipo]?.color}`}>
                              {s.tipo === 'N' ? setIdx + 1 : s.tipo}
                            </button>

                            {/* PESO */}
                            <input 
                              type="number" 
                              placeholder="0"
                              value={s.kg} 
                              onChange={e => {
                                const actual = { ...sesionActiva };
                                actual.ejercicios[ejIdx].series[setIdx].kg = e.target.value;
                                setSesionActiva(actual);
                              }}
                              className="col-span-4 bg-gray-800 text-center py-1.5 rounded-lg text-xs font-bold text-white outline-none focus:ring-1 focus:ring-blue-500"
                            />

                            {/* REPETICIONES */}
                            <input 
                              type="number" 
                              placeholder="0"
                              value={s.reps} 
                              onChange={e => {
                                const actual = { ...sesionActiva };
                                actual.ejercicios[ejIdx].series[setIdx].reps = e.target.value;
                                setSesionActiva(actual);
                              }}
                              className="col-span-4 bg-gray-800 text-center py-1.5 rounded-lg text-xs font-bold text-white outline-none focus:ring-1 focus:ring-blue-500"
                            />

                            {/* CHECKBOX HEVY */}
                            <button 
                              onClick={() => toggleCompletado(ejIdx, setIdx)}
                              className={`col-span-2 h-7 rounded-lg font-black text-xs flex items-center justify-center transition-all ${
                                s.completado ? 'bg-green-500 text-black shadow-md shadow-green-500/20' : 'bg-gray-700 text-gray-400'
                              }`}
                            >
                              ✓
                            </button>
                          </div>
                        ))}
                      </div>

                      <button onClick={() => agregarSerie(ejIdx)} className="w-full py-2 bg-gray-800 hover:bg-gray-700 text-xs font-bold rounded-xl text-gray-300">
                        + Agregar Serie
                      </button>
                    </div>
                  ))}

                  <button onClick={agregarEjercicio} className="w-full py-3 border border-dashed border-gray-800 text-xs font-bold rounded-2xl text-blue-400 uppercase tracking-wider">
                    + Agregar Ejercicio
                  </button>
                </div>
              )}
            </div>
          )}

          {/* VISTA 2: HISTORIAL Y METRICAS PRO */}
          {tab === 'perfil' && (
            <div className="space-y-4">
              <h2 className="text-lg font-black">Resumen de Progreso</h2>
              {historial.length === 0 ? (
                <p className="text-xs text-gray-500">Aún no has completado entrenamientos.</p>
              ) : (
                historial.map((h, i) => (
                  <div key={i} className="bg-gray-900 border border-gray-800 p-4 rounded-2xl space-y-2">
                    <div className="flex justify-between items-center">
                      <h3 className="font-bold text-sm text-blue-400">{h.titulo}</h3>
                      <span className="text-[10px] text-gray-500 font-bold">{new Date(h.fin).toLocaleDateString()}</span>
                    </div>
                    <div className="grid grid-cols-2 gap-2 text-center bg-gray-800/40 p-2 rounded-xl text-xs">
                      <div>
                        <p className="text-gray-400 text-[10px] uppercase font-bold">Volumen</p>
                        <p className="font-black text-white">{h.volumenTotal} kg</p>
                      </div>
                      <div>
                        <p className="text-gray-400 text-[10px] uppercase font-bold">Reps Totales</p>
                        <p className="font-black text-white">{h.repsTotales}</p>
                      </div>
                    </div>
                  </div>
                ))
              )}
            </div>
          )}

          {/* NAVEGACION INFERIOR ESTILO HEVY */}
          <nav className="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-gray-950/90 backdrop-blur-md border-t border-gray-800 p-3 flex justify-around text-[10px] font-black uppercase tracking-wider">
            <button onClick={() => setTab('entrenar')} className={tab === 'entrenar' ? 'text-blue-500' : 'text-gray-500'}>
              Entrenar
            </button>
            <button onClick={() => setTab('perfil')} className={tab === 'perfil' ? 'text-blue-500' : 'text-gray-500'}>
              Perfil
            </button>
          </nav>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
