<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generador de Rutinas con IA</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
      background-color: #f4f4f9;
      color: #333;
    }
    .card {
      background: white;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }
    h1 {
      margin-top: 0;
      font-size: 1.5rem;
      color: #111;
    }
    label {
      display: block;
      margin-top: 15px;
      font-weight: 600;
    }
    select, input, button {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 1rem;
    }
    button {
      margin-top: 20px;
      background-color: #0066cc;
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background-color: #0052a3;
    }
    button:disabled {
      background-color: #a0c4ff;
      cursor: not-allowed;
    }
    #resultado {
      margin-top: 20px;
      padding: 15px;
      background: #eef2ff;
      border-radius: 8px;
      white-space: pre-wrap;
      display: none;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>✨ Generador de Rutinas IA</h1>
    
    <label for="objetivo">Objetivo:</label>
    <select id="objetivo">
      <option value="Ganar masa muscular">Ganar masa muscular</option>
      <option value="Perder grasa">Perder grasa</option>
      <option value="Mejorar resistencia">Mejorar resistencia</option>
    </select>

    <label for="dias">Días por semana:</label>
    <input type="number" id="dias" min="1" max="7" value="3">

    <label for="nivel">Nivel:</label>
    <select id="nivel">
      <option value="Principiante">Principiante</option>
      <option value="Intermedio">Intermedio</option>
      <option value="Avanzado">Avanzado</option>
    </select>

    <button id="btnGenerar" onclick="generarRutina()">Generar rutina con IA</button>

    <div id="resultado"></div>
  </div>

  <script>
    async function generarRutina() {
      const objetivo = document.getElementById('objetivo').value;
      const dias = document.getElementById('dias').value;
      const nivel = document.getElementById('nivel').value;
      const btn = document.getElementById('btnGenerar');
      const resultadoDiv = document.getElementById('resultado');

      btn.disabled = true;
      btn.innerText = "Generando rutina...";
      resultadoDiv.style.display = "none";

      try {
        const response = await fetch('/api/generar', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ objetivo, dias, nivel })
        });

        const data = await response.json();

        if (response.ok) {
          resultadoDiv.innerText = data.rutina;
          resultadoDiv.style.display = "block";
        } else {
          alert('Error: ' + (data.error || 'No se pudo generar la rutina'));
        }
      } catch (error) {
        alert('Ocurrió un error al conectar con el servidor.');
      } finally {
        btn.disabled = false;
        btn.innerText = "✨ Generar rutina con IA";
      }
    }
  </script>

</body>
</html>
