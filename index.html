<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>FitAI Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; }
    input[type="number"]::-webkit-inner-spin-button, 
    input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-[#f7f8fa] dark:bg-gray-950 text-gray-900 dark:text-gray-100 min-h-screen pb-20">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [tab, setTab] = useState('generar');
      const [darkMode, setDarkMode] = useState(false);

      useEffect(() => {
        if (darkMode) document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
      }, [darkMode]);

      const [formData, setFormData] = useState({
        nombre: 'Atleta', 
        genero: 'Mujer',
        dia: 'Lunes',
        enfoque: 'Dominancia Cuádriceps & Tensión Glúteos'
      });

      // RUTINA PROFESIONAL SINCRONIZADA DESDE LA BD
      const [rutinaActual, setRutinaActual] = useState({
        titulo: "Programa de Hipertrofia & Fuerza Aplicada - Día 1",
        genero: "Mujer",
        dia: "Lunes",
        bloques: [
          {
            bloque: "Lunes - Bloque 1: Dominancia Cuádriceps",
            ejercicios: [
              { nombre: "Extensión de cuádriceps", series: "4 series (30/20/15/15)", desc: "Pirámide ascendente de carga. Sube el peso en cada serie. Mantén 1 segundo de pausa isométrica arriba." },
              { nombre: "Prensa inclinada", series: "4 x 15 reps + 10s isometría", desc: "Al terminar la repetición 15, sostiene la carga a la mitad (90°) durante 10 segundos continuos." },
              { nombre: "Sentadilla Hack", series: "4 x 15 reps + 10s isometría", desc: "Rango profundo. Sostén la tensión al centro del recorrido durante 10 segundos al finalizar." },
              { nombre: "Estocadas caminadas", series: "4 x 12 reps (por pierna)", desc: "Trabajo con peso manteniendo el torso con ligera inclinación para enfocar el esfuerzo en el cuádriceps." },
              { nombre: "Sentadilla libre AyC", series: "4 x 15 reps (Lentas)", desc: "Ejecución a ritmo muy lento alternando postura Abierta y Cerrada (AyC) entre repeticiones." }
            ]
          },
          {
            bloque: "Lunes - Bloque 2: Tensión Glúteos",
            ejercicios: [
              { nombre: "Empuje de cadera (Barra)", series: "4 x (10 + 10s + 10)", desc: "10 reps intensas + 10s de isometría arriba apretando fuerte + 10 repeticiones adicionales de remate." },
              { nombre: "Sentadilla Sumo (Mancuerna)", series: "4 x (10/15/20)", desc: "Pirámide descendente: Empieza con el máximo peso a 10 reps y baja la carga subiendo repeticiones." },
              { nombre: "Patada de glúteo Tri-Serie", series: "4 x (15+15+15)", desc: "Secuencia sin descanso: 15 posteriores + 15 laterales + 15 diagonales por pierna." }
            ]
          }
        ]
      });

      const [loading, setLoading] = useState(false);
      const [sesionActiva, setSesionActiva] = useState(null);

      const handleGenerarCloud = (e) => {
        e.preventDefault();
        setLoading(true);
        setTimeout(() => {
          setLoading(false);
          setTab('entrenar');
        }, 400);
      };

      const formControlClass = "w-full p-3.5 rounded-2xl bg-[#f4f5f7] dark:bg-gray-800/50 border-none text-[13px] font-medium text-gray-900 dark:text-gray-100 outline-none";
      const labelClass = "block text-[10px] font-extrabold text-[#6b7280] dark:text-gray-400 uppercase tracking-widest mb-1.5 ml-1";

      return (
        <div className="max-w-md mx-auto p-4 space-y-4">
          
          <header className="bg-white dark:bg-gray-900 rounded-[2rem] py-3.5 px-5 shadow-sm border border-gray-100/80 dark:border-gray-800 flex justify-between items-center">
            <div className="flex items-center space-x-3">
              <div className="w-9 h-9 bg-[#2b6ded] text-white font-black rounded-full flex items-center justify-center text-sm shadow-sm">F</div>
              <h1 className="text-[16px] font-black text-gray-900 dark:text-white tracking-tight">FitAI <span className="text-[#2b6ded] font-medium">Pro</span></h1>
            </div>
            <button onClick={() => setDarkMode(!darkMode)} className="w-9 h-9 bg-gray-50 dark:bg-gray-800 rounded-full flex items-center justify-center text-[15px]">
              {darkMode ? '☀️' : '🌙'}
            </button>
          </header>

          <nav className="bg-[#ecedf1] dark:bg-gray-800/60 p-1.5 rounded-2xl flex justify-between text-[11px] font-semibold">
            {['Generar', 'Entrenar', 'Social', 'Timer'].map(t => (
              <button 
                key={t}
                onClick={() => setTab(t.toLowerCase())}
                className={`flex-1 py-2 rounded-xl transition-all ${
                  tab === t.toLowerCase() 
                    ? 'bg-white dark:bg-gray-700 text-gray-900 dark:text-white shadow-sm font-bold' 
                    : 'text-[#6b7280] dark:text-gray-400'
                }`}
              >
                {t}
              </button>
            ))}
          </nav>

          <main className="space-y-4">

            {/* GENERADOR CLOUD PROFESIONAL */}
            {tab === 'generar' && (
              <form onSubmit={handleGenerarCloud} className="bg-white dark:bg-gray-900 rounded-[2rem] p-6 shadow-sm border border-gray-100/80 dark:border-gray-800 space-y-4">
                <div>
                  <h2 className="text-[20px] font-black text-gray-900 dark:text-white">Planificación Profesional</h2>
                  <p className="text-[12px] text-[#6b7280] mt-1">Sincroniza los programas basados en tus guías avanzadas desde Supabase.</p>
                </div>

                <div className="grid grid-cols-2 gap-3">
                  <div><label className={labelClass}>ATLETA</label><input type="text" value={formData.nombre} onChange={e=>setFormData({...formData, nombre: e.target.value})} className={formControlClass} /></div>
                  <div>
                    <label className={labelClass}>PROGRAMA / GÉNERO</label>
                    <select value={formData.genero} onChange={e=>setFormData({...formData, genero: e.target.value})} className={formControlClass}>
                      <option>Mujer</option>
                      <option>Hombre</option>
                    </select>
                  </div>
                </div>

                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <label className={labelClass}>DÍA DE LA SEMANA</label>
                    <select value={formData.dia} onChange={e=>setFormData({...formData, dia: e.target.value})} className={formControlClass}>
                      <option>Lunes</option>
                      <option>Martes</option>
                      <option>Miércoles</option>
                      <option>Jueves</option>
                      <option>Viernes</option>
                    </select>
                  </div>
                  <div>
                    <label className={labelClass}>ENFOQUE</label>
                    <input type="text" value={formData.enfoque} onChange={e=>setFormData({...formData, enfoque: e.target.value})} className={formControlClass} />
                  </div>
                </div>

                <button type="submit" disabled={loading} className="w-full py-4 rounded-[1.25rem] bg-gradient-to-r from-[#306ee8] to-[#1c4baf] text-white font-extrabold text-[11px] uppercase tracking-widest shadow-md">
                  {loading ? 'SINCRONIZANDO NUBE...' : 'CARGAR RUTINA DESDE SUPABASE'}
                </button>
              </form>
            )}

            {/* PESTAÑA ENTRENAR */}
            {tab === 'entrenar' && !sesionActiva && (
              <div className="space-y-4">
                <div className="bg-blue-600/10 border border-blue-500/20 p-4 rounded-2xl space-y-1">
                  <span className="text-[10px] font-black uppercase text-blue-600 dark:text-blue-400">Cloud Sincronizado • {formData.genero}</span>
                  <h3 className="font-extrabold text-[15px]">{rutinaActual.titulo}</h3>
                  <p className="text-[11px] text-gray-500">Día: {formData.dia} • {formData.enfoque}</p>
                </div>

                {rutinaActual.bloques.map((bloque, bIdx) => (
                  <div key={bIdx} className="bg-white dark:bg-gray-900 rounded-[2rem] p-5 shadow-sm border border-gray-100/80 dark:border-gray-800 space-y-4">
                    <div className="flex justify-between items-center border-b border-gray-100 dark:border-gray-800 pb-3">
                      <h3 className="font-extrabold text-[14px] text-blue-600 dark:text-blue-400">{bloque.bloque}</h3>
                      <button onClick={() => setSesionActiva(bloque)} className="text-[11px] font-bold text-white bg-[#2b6ded] px-3.5 py-1.5 rounded-full shadow-sm">Entrenar Bloque</button>
                    </div>
                    <div className="space-y-3">
                      {bloque.ejercicios.map((ej, ejIdx) => (
                        <div key={ejIdx} className="bg-[#f7f8fa] dark:bg-gray-800/40 p-3.5 rounded-2xl space-y-1">
                          <div className="flex justify-between items-center">
                            <h4 className="font-bold text-[13px]">{ej.nombre}</h4>
                            <span className="text-[11px] font-extrabold text-[#2b6ded]">{ej.series}</span>
                          </div>
                          <p className="text-[11px] text-gray-500">{ej.desc}</p>
                        </div>
                      ))}
                    </div>
                  </div>
                ))}
              </div>
            )}

            {tab === 'entrenar' && sesionActiva && (
              <div className="bg-white dark:bg-gray-900 rounded-[2rem] p-6 shadow-sm border border-gray-100/80 dark:border-gray-800 space-y-4">
                <h2 className="text-[18px] font-black">Sesión Activa: {sesionActiva.bloque}</h2>
                <p className="text-xs text-gray-500">Registra tus marcas aplicando las pirámides e isometrías correspondientes.</p>
                <button onClick={() => setSesionActiva(null)} className="w-full py-3.5 bg-green-600 text-white font-extrabold text-[12px] rounded-2xl">
                  ✓ Finalizar Bloque
                </button>
              </div>
            )}

            {/* PESTAÑA SOCIAL */}
            {tab === 'social' && (
              <div className="bg-white dark:bg-gray-900 rounded-[2rem] p-6 shadow-sm border border-gray-100 dark:border-gray-800 space-y-3 text-center">
                <h3 className="text-[16px] font-black">Comunidad FitAI Pro</h3>
                <p className="text-xs text-gray-500">Comparte tus marcas y avances con otros atletas del programa.</p>
              </div>
            )}

            {/* PESTAÑA TIMER */}
            {tab === 'timer' && (
              <div className="bg-white dark:bg-gray-900 rounded-[2rem] p-8 shadow-sm border border-gray-100 dark:border-gray-800 text-center space-y-4">
                <span className="text-[10px] font-black text-[#2b6ded] uppercase">DESCANSO / ISOMETRÍA</span>
                <div className="text-[64px] font-black leading-none">00:45</div>
                <button className="px-7 py-2.5 bg-[#306ee8] text-white font-bold text-[12px] rounded-xl">Iniciar Timer</button>
              </div>
            )}

          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
