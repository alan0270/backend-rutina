<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>FitAI Pro - Entrenador Personal Inteligente</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdf4',
              500: '#22c55e',
              600: '#16a34a',
              700: '#15803d',
            }
          }
        }
      }
    }
  </script>
  <!-- React & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- jsPDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    body {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .safe-pb {
      padding-bottom: max(1.5rem, env(safe-area-inset-bottom));
    }
  </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 min-h-screen transition-colors duration-200">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, Component } = React;

    class ErrorBoundary extends Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, errorInfo: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true };
      }
      componentDidCatch(error, errorInfo) {
        console.error("Error visual:", error, errorInfo);
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="p-6 text-center min-h-screen flex flex-col justify-center items-center bg-gray-50 dark:bg-gray-900">
              <div className="bg-red-500/10 p-4 rounded-2xl border border-red-500 max-w-sm space-y-3">
                <h2 className="font-bold text-red-600 text-lg">Se produjo un error visual</h2>
                <p className="text-xs text-gray-600 dark:text-gray-400">
                  Limpiando datos corruptos para restaurar la interfaz.
                </p>
                <button 
                  onClick={() => {
                    localStorage.clear();
                    window.location.reload();
                  }}
                  className="px-4 py-2 bg-red-600 text-white font-bold text-xs rounded-xl shadow-md"
                >
                  Restaurar App
                </button>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    const BIBLIOTECA_EJERCICIOS = [
      {
        nombre: "Hip Thrust con Barra",
        musculo: "Glúteos",
        media: "https://images.unsplash.com/photo-1534438327276-14e5300c3a48?w=500&auto=format&fit=crop&q=60",
        pasos: "Apoya la zona escapular en el banco, coloca la barra sobre la pelvis y empuja hacia arriba contrayendo glúteos.",
        errores: "Hiperextender la zona lumbar en la parte alta."
      },
      {
        nombre: "Prensa de Piernas Inclina",
        musculo: "Cuádriceps",
        media: "https://images.unsplash.com/photo-1574680096145-d05b474e2155?w=500&auto=format&fit=crop&q=60",
        pasos: "Ubica los pies a lo ancho de los hombros, desengancha el seguro y baja hasta formar un ángulo de 90°.",
        errores: "Despegar la cadera del respaldo al bajar."
      },
      {
        nombre: "Sentadilla Sumo con Mancuerna",
        musculo: "Cuádriceps",
        media: "https://images.unsplash.com/photo-1571019614242-c5c5dee9f50b?w=500&auto=format&fit=crop&q=60",
        pasos: "Abre los pies más allá del ancho de cadera con las puntas a 45°, sostiene la mancuerna al centro y baja erguido.",
        errores: "Meter las rodillas hacia adentro al ascender."
      },
      {
        nombre: "Press de Banca Plano con Barra",
        musculo: "Pecho",
        media: "https://images.unsplash.com/photo-1517838277536-f5f99be501cd?w=500&auto=format&fit=crop&q=60",
        pasos: "Tumbado en banco, sujetar la barra ligeramente más ancho que los hombros y bajar al esternón.",
        errores: "Despegar los glúteos del banco."
      },
      {
        nombre: "Jalón al Pecho Agarre Abierto",
        musculo: "Espalda",
        media: "https://images.unsplash.com/photo-1605296867304-46d5465a13f1?w=500&auto=format&fit=crop&q=60",
        pasos: "Sujeta la barra, saca pecho y tracciona dirigiendo los codos hacia la cadera.",
        errores: "Balancear excesivamente el torso hacia atrás."
      },
      {
        nombre: "Press Militar con Mancuernas",
        musculo: "Hombros",
        media: "https://images.unsplash.com/photo-1581009146145-b5ef050c2e1e?w=500&auto=format&fit=crop&q=60",
        pasos: "Sentado en banco a 90°, sube las mancuernas sobre la cabeza extendiendo brazos sin bloquear codos.",
        errores: "Arquear la espalda lumbar."
      }
    ];

    const OPCIONES_LESIONES = [
      "Espalda baja (evitar cargas axiales)",
      "Rodilla (evitar gran flexión)",
      "Hombro (evitar sobrecabezas)",
      "Muñeca / Codo"
    ];

    function formatearSeriesReps(series, repsBase, nota = '') {
      const s = series || 1;
      const r = repsBase || '10';
      const n = nota && nota.trim() !== '' ? ` (${nota.trim()})` : '';
      return `${s} series × ${r} reps${n}`;
    }

    function App() {
      const [tab, setTab] = useState('generar');
      const [darkMode, setDarkMode] = useState(() => localStorage.getItem('fitai_theme') === 'dark');

      const [formData, setFormData] = useState({
        nombre: '',
        edad: '',
        peso: '',
        estatura: '',
        genero: 'Hombre',
        objetivo: 'Ganar músculo',
        dias: '3',
        nivel: 'Intermedio',
        lesiones: [],
        equipo: 'Gimnasio completo',
        duracion: '60'
      });
      const [errors, setErrors] = useState({});
      const [loading, setLoading] = useState(false);

      const [rutinaActual, setRutinaActual] = useState(() => {
        try {
          const saved = localStorage.getItem('fitai_rutina');
          return saved ? JSON.parse(saved) : null;
        } catch(e) { return null; }
      });

      const [modalBuscadorOpen, setModalBuscadorOpen] = useState(false);
      const [busquedaEjercicio, setBusquedaEjercicio] = useState('');
      const [rutinaEditando, setRutinaEditando] = useState({ titulo: 'Mi Rutina Personalizada', ejercicios: [] });

      const [sesionActiva, setSesionActiva] = useState(null);
      const [tiempoRestante, setTiempoRestante] = useState(0);
      const finTiempoRef = useRef(null);

      const [timerConfig, setTimerConfig] = useState({ prep: 5, trabajo: 30, descanso: 30, rondas: 3 });
      const [timerEstado, setTimerEstado] = useState({ corriendo: false, fase: 'PREP', rondaActual: 1, segundosTotales: 5 });
      const timerTargetRef = useRef(null);

      useEffect(() => {
        if (darkMode) {
          document.documentElement.classList.add('dark');
          localStorage.setItem('fitai_theme', 'dark');
        } else {
          document.documentElement.classList.remove('dark');
          localStorage.setItem('fitai_theme', 'light');
        }
      }, [darkMode]);

      useEffect(() => {
        if (rutinaActual) localStorage.setItem('fitai_rutina', JSON.stringify(rutinaActual));
      }, [rutinaActual]);

      const hablar = (texto) => {
        if ('speechSynthesis' in window) {
          try {
            window.speechSynthesis.cancel();
            const ut = new SpeechSynthesisUtterance(texto);
            ut.lang = 'es-ES';
            window.speechSynthesis.speak(ut);
          } catch(e){}
        }
      };

      useEffect(() => {
        let interval = null;
        if (timerEstado.corriendo) {
          interval = setInterval(() => {
            const ahora = Date.now();
            const rest = Math.max(0, Math.ceil((timerTargetRef.current - ahora) / 1000));
            setTimerEstado(prev => ({ ...prev, segundosTotales: rest }));

            if (rest <= 0) {
              if (timerEstado.fase === 'PREP') {
                hablar("¡A trabajar!");
                timerTargetRef.current = Date.now() + timerConfig.trabajo * 1000;
                setTimerEstado(prev => ({ ...prev, fase: 'TRABAJO', segundosTotales: timerConfig.trabajo }));
              } else if (timerEstado.fase === 'TRABAJO') {
                hablar("Descanso");
                timerTargetRef.current = Date.now() + timerConfig.descanso * 1000;
                setTimerEstado(prev => ({ ...prev, fase: 'DESCANSO', segundosTotales: timerConfig.descanso }));
              } else if (timerEstado.fase === 'DESCANSO') {
                if (timerEstado.rondaActual < timerConfig.rondas) {
                  hablar(`Ronda ${timerEstado.rondaActual + 1}. ¡A trabajar!`);
                  timerTargetRef.current = Date.now() + timerConfig.trabajo * 1000;
                  setTimerEstado(prev => ({
                    ...prev,
                    fase: 'TRABAJO',
                    rondaActual: prev.rondaActual + 1,
                    segundosTotales: timerConfig.trabajo
                  }));
                } else {
                  hablar("Entrenamiento completado");
                  setTimerEstado(prev => ({ ...prev, corriendo: false, fase: 'FIN', segundosTotales: 0 }));
                  clearInterval(interval);
                }
              }
            }
          }, 200);
        }
        return () => clearInterval(interval);
      }, [timerEstado.corriendo, timerEstado.fase, timerEstado.rondaActual, timerConfig]);

      const iniciarTimerConfigurable = () => {
        hablar(`Prepárate. ${timerConfig.prep} segundos`);
        timerTargetRef.current = Date.now() + timerConfig.prep * 1000;
        setTimerEstado({
          corriendo: true,
          fase: 'PREP',
          rondaActual: 1,
          segundosTotales: timerConfig.prep
        });
      };

      useEffect(() => {
        let interval = null;
        if (sesionActiva && sesionActiva.estado === 'descanso') {
          interval = setInterval(() => {
            const ahora = Date.now();
            const rest = Math.max(0, Math.ceil((finTiempoRef.current - ahora) / 1000));
            setTiempoRestante(rest);
            if (rest <= 0) {
              hablar("Siguiente serie");
              siguienteSerieSiguienteEj();
            }
          }, 200);
        }
        return () => clearInterval(interval);
      }, [sesionActiva]);

      const handleFormSubmit = async (e) => {
        e.preventDefault();
        const errs = {};
        if (!formData.nombre.trim()) errs.nombre = 'El nombre es obligatorio.';
        const eVal = parseInt(formData.edad);
        if (!eVal || eVal < 14 || eVal > 80) errs.edad = 'Edad entre 14 y 80 años.';
        const estVal = parseInt(formData.estatura);
        if (!estVal || estVal < 120 || estVal > 230) errs.estatura = 'Estatura entre 120 y 230 cm.';
        
        if (Object.keys(errs).length > 0) {
          setErrors(errs);
          return;
        }
        setErrors({});
        setLoading(true);

        try {
          const res = await fetch('/api/generar', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(formData)
          });
          const data = await res.json();
          if (res.ok && data && data.dias) {
            const rutinaEnriquecida = {
              ...data,
              usuario: formData.nombre,
              dias: data.dias.map(d => ({
                ...d,
                ejercicios: (d.ejercicios || []).map(ej => {
                  const enDb = BIBLIOTECA_EJERCICIOS.find(b => b.nombre.toLowerCase().includes((ej.nombre||'').toLowerCase()));
                  return {
                    ...ej,
                    media: ej.media || (enDb ? enDb.media : null),
                    pasos: ej.pasos || (enDb ? enDb.pasos : 'Ejecuta el movimiento con técnica adecuada.'),
                    errores: ej.errores || (enDb ? enDb.errores : 'Evita impulsarte con la espalda.')
                  };
                })
              }))
            };
            setRutinaActual(rutinaEnriquecida);
            setTab('rutina');
          } else {
            alert(data.error || 'No se pudo generar la rutina.');
          }
        } catch (err) {
          alert('Error de conexión con el servidor');
        } finally {
          setLoading(false);
        }
      };

      const toggleLesion = (lesion) => {
        setFormData(prev => {
          const existe = prev.lesiones.includes(lesion);
          return { ...prev, lesiones: existe ? prev.lesiones.filter(l => l !== lesion) : [...prev.lesiones, lesion] };
        });
      };

      const iniciarEntrenamiento = (diaIdx) => {
        setSesionActiva({ diaIdx, ejIdx: 0, serieActual: 1, registros: {}, estado: 'ejercicio' });
        setTab('entrenar');
      };

      const completarSerie = () => {
        const currentEj = rutinaActual?.dias?.[sesionActiva.diaIdx]?.ejercicios?.[sesionActiva.ejIdx];
        const segs = currentEj?.descansoSeg || 60;
        finTiempoRef.current = Date.now() + segs * 1000;
        setTiempoRestante(segs);
        setSesionActiva(prev => ({ ...prev, estado: 'descanso' }));
      };

      const siguienteSerieSiguienteEj = () => {
        const dia = rutinaActual?.dias?.[sesionActiva.diaIdx];
        const ej = dia?.ejercicios?.[sesionActiva.ejIdx];

        if (ej && sesionActiva.serieActual < ej.series) {
          setSesionActiva(prev => ({ ...prev, serieActual: prev.serieActual + 1, estado: 'ejercicio' }));
        } else if (dia && sesionActiva.ejIdx + 1 < dia.ejercicios.length) {
          setSesionActiva(prev => ({ ...prev, ejIdx: prev.ejIdx + 1, serieActual: 1, estado: 'ejercicio' }));
        } else {
          setSesionActiva(prev => ({ ...prev, estado: 'fin' }));
        }
      };

      return (
        <div className="max-w-2xl mx-auto min-h-screen flex flex-col justify-between bg-white dark:bg-gray-900 shadow-xl transition-colors">
          <header className="p-4 border-b border-gray-200 dark:border-gray-800 flex justify-between items-center sticky top-0 bg-white/80 dark:bg-gray-900/80 backdrop-blur-md z-30">
            <div className="flex items-center space-x-2">
              <div className="bg-brand-600 text-white p-2 rounded-xl shadow-md font-black text-sm">⚡</div>
              <h1 className="text-xl font-black bg-gradient-to-r from-brand-600 to-green-400 bg-clip-text text-transparent">FitAI Pro</h1>
            </div>
            <button onClick={() => setDarkMode(!darkMode)} className="p-2 rounded-xl bg-gray-100 dark:bg-gray-800 text-xs">
              {darkMode ? "☀️" : "🌙"}
            </button>
          </header>

          <main className="p-4 flex-1">
            {tab === 'generar' && (
              <form onSubmit={handleFormSubmit} className="space-y-4">
                <h2 className="text-lg font-bold text-gray-800 dark:text-gray-100">Configura tu perfil</h2>
                
                <div>
                  <label className="block text-xs font-semibold text-gray-500 uppercase mb-1">Nombre *</label>
                  <input 
                    type="text" 
                    placeholder="Ej. Carlos García" 
                    value={formData.nombre}
                    onChange={e => setFormData({ ...formData, nombre: e.target.value })}
                    className="w-full p-3 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 text-sm outline-none"
                  />
                  {errors.nombre && <p className="text-red-500 text-xs mt-1">{errors.nombre}</p>}
                </div>

                <div className="grid grid-cols-3 gap-3">
                  <div>
                    <label className="block text-xs font-semibold text-gray-500 uppercase mb-1">Edad *</label>
                    <input 
                      type="number" 
                      placeholder="28" 
                      value={formData.edad}
                      onChange={e => setFormData({ ...formData, edad: e.target.value })}
                      className="w-full p-3 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 text-sm outline-none"
                    />
                    {errors.edad && <p className="text-red-500 text-xs mt-1">{errors.edad}</p>}
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-gray-500 uppercase mb-1">Peso (kg)</label>
                    <input 
                      type="number" 
                      placeholder="75" 
                      value={formData.peso}
                      onChange={e => setFormData({ ...formData, peso: e.target.value })}
                      className="w-full p-3 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 text-sm outline-none"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-gray-500 uppercase mb-1">Estatura *</label>
                    <input 
                      type="number" 
                      placeholder="175" 
                      value={formData.estatura}
                      onChange={e => setFormData({ ...formData, estatura: e.target.value })}
                      className="w-full p-3 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 text-sm outline-none"
                    />
                    {errors.estatura && <p className="text-red-500 text-xs mt-1">{errors.estatura}</p>}
                  </div>
                </div>

                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <label className="block text-xs font-semibold text-gray-500 uppercase mb-1">Género</label>
                    <select value={formData.genero} onChange={e => setFormData({ ...formData, genero: e.target.value })} className="w-full p-3 rounded-xl border dark:border-gray-700 bg-gray-50 dark:bg-gray-800 text-sm">
                      <option value="Hombre">Hombre</option>
                      <option value="Mujer">Mujer</option>
                    </select>
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-gray-500 uppercase mb-1">Días por semana</label>
                    <select value={formData.dias} onChange={e => setFormData({ ...formData, dias: e.target.value })} className="w-full p-3 rounded-xl border dark:border-gray-700 bg-gray-50 dark:bg-gray-800 text-sm">
                      <option value="2">2 días</option>
                      <option value="3">3 días</option>
                      <option value="4">4 días</option>
                      <option value="5">5 días</option>
                    </select>
                  </div>
                </div>

                <div>
                  <label className="block text-xs font-semibold text-gray-500 uppercase mb-2">Lesiones / Limitaciones</label>
                  <div className="grid grid-cols-2 gap-2">
                    {OPCIONES_LESIONES.map(lesion => {
                      const sel = formData.lesiones.includes(lesion);
                      return (
                        <button
                          key={lesion}
                          type="button"
                          onClick={() => toggleLesion(lesion)}
                          className={`p-2.5 text-xs text-left rounded-xl border ${sel ? 'bg-red-500/10 border-red-500 text-red-600 font-semibold' : 'border-gray-200 dark:border-gray-700 text-gray-500'}`}
                        >
                          {sel ? '✓ ' : '+ '}{lesion}
                        </button>
                      );
                    })}
                  </div>
                </div>

                <button 
                  type="submit" 
                  disabled={loading}
                  className="w-full p-4 bg-brand-600 hover:bg-brand-700 text-white font-bold rounded-2xl shadow-lg transition-transform active:scale-95 disabled:opacity-50 text-sm"
                >
                  {loading ? 'Generando rutina...' : '✨ Generar rutina con IA'}
                </button>
              </form>
            )}

            {tab === 'rutina' && (
              <div className="space-y-6">
                {!rutinaActual || !rutinaActual.dias ? (
                  <div className="text-center py-12 text-gray-500 text-sm">No hay rutina activa. Genera una nueva en el menú Generar.</div>
                ) : (
                  <>
                    <h2 className="text-xl font-black">Plan de {rutinaActual.usuario || 'Atleta'}</h2>
                    {rutinaActual.dias.map((dia, diaIdx) => (
                      <div key={diaIdx} className="border border-gray-200 dark:border-gray-800 rounded-2xl p-4 bg-gray-50/50 dark:bg-gray-800/30 space-y-3">
                        <div className="flex justify-between items-center">
                          <h3 className="font-bold text-brand-600 dark:text-brand-500 text-sm">{dia.nombre}</h3>
                          <button onClick={() => iniciarEntrenamiento(diaIdx)} className="px-3 py-1 bg-brand-600 text-white text-xs rounded-lg font-bold">
                            ▶ Entrenar
                          </button>
                        </div>
                        <div className="space-y-3">
                          {(dia.ejercicios || []).map((ej, ejIdx) => (
                            <div key={ejIdx} className="flex space-x-3 bg-white dark:bg-gray-800 p-3 rounded-xl border border-gray-100 dark:border-gray-700/50">
                              <div className="w-16 h-16 bg-gray-100 dark:bg-gray-700 rounded-lg overflow-hidden flex-shrink-0">
                                {ej.media && <img src={ej.media} alt={ej.nombre} className="w-full h-full object-cover" />}
                              </div>
                              <div className="flex-1 text-xs space-y-1">
                                <h4 className="font-bold text-sm">{ej.nombre}</h4>
                                <p className="text-brand-600 font-semibold">{formatearSeriesReps(ej.series, ej.repsBase, ej.nota)}</p>
                                <p className="text-gray-500">Descanso: {ej.descansoSeg}s</p>
                              </div>
                            </div>
                          ))}
                        </div>
                      </div>
                    ))}
                  </>
                )}
              </div>
            )}

            {tab === 'entrenar' && (
              <div className="space-y-4">
                {!sesionActiva ? (
                  <div className="text-center py-12 text-gray-500 text-sm">Selecciona un día en la pestaña Rutina para entrenar.</div>
                ) : sesionActiva.estado === 'fin' ? (
                  <div className="text-center py-12 space-y-4">
                    <h2 className="text-2xl font-black text-brand-600">¡Entrenamiento Completado! 🎉</h2>
                    <button onClick={() => setTab('rutina')} className="px-6 py-3 bg-brand-600 text-white font-bold rounded-xl text-sm">
                      Volver a Rutinas
                    </button>
                  </div>
                ) : (
                  (() => {
                    const dia = rutinaActual?.dias?.[sesionActiva.diaIdx];
                    const ej = dia?.ejercicios?.[sesionActiva.ejIdx];
                    if (!dia || !ej) return null;

                    return (
                      <div className="space-y-4">
                        {sesionActiva.estado === 'descanso' ? (
                          <div className="text-center py-12 bg-gray-50 dark:bg-gray-800 rounded-2xl border space-y-4">
                            <h3 className="text-xs font-bold text-gray-500 uppercase">Tiempo de descanso</h3>
                            <div className="text-6xl font-black text-brand-600">{tiempoRestante}s</div>
                            <button onClick={siguienteSerieSiguienteEj} className="px-6 py-2 bg-gray-200 dark:bg-gray-700 font-bold rounded-xl text-xs">
                              Saltar Descanso
                            </button>
                          </div>
                        ) : (
                          <div className="space-y-4">
                            <div className="relative h-48 bg-gray-100 dark:bg-gray-800 rounded-2xl overflow-hidden">
                              {ej.media && <img src={ej.media} alt={ej.nombre} className="w-full h-full object-cover" />}
                              <div className="absolute top-2 right-2 bg-black/60 text-white px-3 py-1 rounded-full text-xs font-bold">
                                Serie {sesionActiva.serieActual} de {ej.series}
                              </div>
                            </div>
                            <h3 className="text-xl font-bold">{ej.nombre}</h3>
                            <button onClick={completarSerie} className="w-full py-4 bg-brand-600 text-white font-bold rounded-xl text-sm shadow-lg">
                              Completar Serie y Descansar
                            </button>
                          </div>
                        )}
                      </div>
                    );
                  })()
                )}
              </div>
            )}

            {tab === 'timer' && (
              <div className="space-y-6 text-center py-4">
                <h2 className="text-xl font-bold">Timer de Intervalos</h2>
                <div className="w-48 h-48 rounded-full border-8 border-brand-600 flex flex-col items-center justify-center mx-auto shadow-xl bg-gray-50 dark:bg-gray-800">
                  <span className="text-xs font-bold text-gray-400">{timerEstado.fase}</span>
                  <span className="text-5xl font-black text-brand-600">{timerEstado.segundosTotales}s</span>
                </div>
                <button onClick={iniciarTimerConfigurable} className="px-8 py-3 bg-brand-600 text-white font-bold rounded-xl text-sm">
                  {timerEstado.corriendo ? "Reiniciar" : "Iniciar"}
                </button>
              </div>
            )}
          </main>

          <nav className="border-t border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900 grid grid-cols-4 p-3 safe-pb sticky bottom-0 z-30 text-center text-xs">
            <button onClick={() => setTab('generar')} className={tab === 'generar' ? 'text-brand-600 font-bold' : 'text-gray-400'}>Generar</button>
            <button onClick={() => setTab('rutina')} className={tab === 'rutina' ? 'text-brand-600 font-bold' : 'text-gray-400'}>Rutina</button>
            <button onClick={() => setTab('entrenar')} className={tab === 'entrenar' ? 'text-brand-600 font-bold' : 'text-gray-400'}>Entrenar</button>
            <button onClick={() => setTab('timer')} className={tab === 'timer' ? 'text-brand-600 font-bold' : 'text-gray-400'}>Timer</button>
          </nav>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
