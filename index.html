<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>FitAI Pro - IA & Social Fitness</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: { 50: '#f0f7ff', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' }
          }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { -webkit-tap-highlight-color: transparent; user-select: none; }
  </style>
</head>
<body class="bg-[#f4f5f8] dark:bg-gray-950 text-gray-800 dark:text-gray-100 min-h-screen font-sans pb-10">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // MOTOR DE INTELIGENCIA ARTIFICIAL LOCAL (Genera rutinas según parámetros del usuario)
    const motorIA_GenerarRutina = (datos) => {
      const { objetivo, dias, lesiones, nivel, equipo, duracion } = datos;
      const numDias = parseInt(dias) || 3;

      const baseEjercicios = {
        pecho: ["Press de Banca Plano", "Press Inclinado con Mancuernas", "Aperturas en Polea"],
        espalda: ["Jalón al Pecho Agarre Abierto", "Remo Horizontal con Barra", "Remo Unilateral con Mancuerna"],
        piernas: lesiones.includes("Espalda baja") 
          ? ["Prensa de Piernas Inclinada", "Hip Thrust con Barra", "Extensión de Cuádriceps", "Curl Femoral Tumbado"]
          : ["Sentadilla Profunda con Barra", "Peso Muerto Rumano", "Hip Thrust", "Zancadas Búlgaras"],
        hombros: ["Press Militar con Mancuernas", "Elevaciones Laterales", "Pájaro para Deltoides Posterior"],
        brazos: ["Curl de Bíceps con Barra", "Extensión de Tríceps Polea Alta", "Curl Martillo"]
      };

      const plantillasPorDias = [
        {
          nombre: "Día 1: Torso (Pecho + Espalda + Hombro)",
          grupos: ['pecho', 'espalda', 'hombros']
        },
        {
          nombre: "Día 2: Pierna Completa & Glúteo",
          grupos: ['piernas']
        },
        {
          nombre: "Día 3: Fullbody & Brazos",
          grupos: ['pecho', 'espalda', 'brazos']
        },
        {
          nombre: "Día 4: Hombro & Brazo Focus",
          grupos: ['hombros', 'brazos']
        },
        {
          nombre: "Día 5: Pierna Enfoque Cadena Posterior",
          grupos: ['piernas']
        }
      ];

      const diasGenerados = plantillasPorDias.slice(0, numDias).map(p => {
        let ejs = [];
        p.grupos.forEach(grupo => {
          baseEjercicios[grupo].forEach(nombreEj => {
            ejs.push({
              nombre: nombreEj,
              series: nivel === 'Avanzado' ? 4 : 3,
              repsBase: objetivo === 'Fuerza' ? '6-8' : '10-12',
              descansoSeg: objetivo === 'Fuerza' ? 120 : 60
            });
          });
        });
        return {
          nombre: p.nombre,
          ejercicios: ejs.slice(0, duracion === '45 min' ? 4 : 6)
        };
      });

      return {
        usuario: datos.nombre,
        objetivo: datos.objetivo,
        nivel: datos.nivel,
        dias: diasGenerados
      };
    };

    // DATOS DE PRUEBA DE INFLUENCERS Y COMUNIDAD
    const INFLUENCERS_MOCK = [
      {
        id: 'inf-1',
        nombre: 'Carlos "Titan" Ruiz',
        handle: '@carlostitan',
        avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop&q=80',
        seguidores: '124K',
        siguiendo: false
      },
      {
        id: 'inf-2',
        nombre: 'Sofía Fitness Pro',
        handle: '@sofi_fit',
        avatar: 'https://images.unsplash.com/photo-1517841905240-472988babdf9?w=150&auto=format&fit=crop&q=80',
        seguidores: '89K',
        siguiendo: true
      }
    ];

    const POSTS_MOCK = [
      {
        id: 'p-1',
        autor: 'Carlos "Titan" Ruiz',
        avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop&q=80',
        tiempo: 'Hace 2h',
        texto: '¡Les dejo un tip clave para la Sentadilla! Mantengan la mirada neutral para cuidar las cervicales.',
        exclusivo: false,
        likes: 342
      },
      {
        id: 'p-2',
        autor: 'Sofía Fitness Pro',
        avatar: 'https://images.unsplash.com/photo-1517841905240-472988babdf9?w=150&auto=format&fit=crop&q=80',
        tiempo: 'Hace 5h',
        texto: '🔒 [RUTINA EXCLUSIVA VIP] Plan especial de hipertrofia de glúteos y femorales cargado para suscriptores.',
        exclusivo: true,
        likes: 890
      }
    ];

    function App() {
      const [tab, setTab] = useState('generar');
      const [darkMode, setDarkMode] = useState(false);

      // ESTADO DEL FORMULARIO DE IA
      const [formData, setFormData] = useState({
        nombre: 'Alan',
        genero: 'Hombre',
        edad: '24',
        estatura: '170',
        objetivo: 'Ganar músculo',
        dias: '3 días',
        equipo: 'Gimnasio completo',
        duracion: '60 min',
        lesiones: 'Espalda baja (Evitar cargas axiales)',
        nivel: 'Intermedio'
      });

      const [loading, setLoading] = useState(false);
      const [rutinaActual, setRutinaActual] = useState(() => {
        try {
          const saved = localStorage.getItem('fitai_rutina');
          return saved ? JSON.parse(saved) : null;
        } catch(e) { return null; }
      });

      const [influencers, setInfluencers] = useState(INFLUENCERS_MOCK);

      useEffect(() => {
        if (rutinaActual) localStorage.setItem('fitai_rutina', JSON.stringify(rutinaActual));
      }, [rutinaActual]);

      // GENERACIÓN DE RUTINA POR IA
      const handleGenerarRutina = (e) => {
        e.preventDefault();
        setLoading(true);

        setTimeout(() => {
          const nuevaRutina = motorIA_GenerarRutina(formData);
          setRutinaActual(nuevaRutina);
          setLoading(false);
          setTab('entrenar');
        }, 900);
      };

      const toggleFollow = (id) => {
        setInfluencers(prev => prev.map(inf => inf.id === id ? { ...inf, siguiendo: !inf.siguiendo } : inf));
      };

      return (
        <div className="max-w-md mx-auto p-4 space-y-4">
          
          {/* HEADER */}
          <header className="bg-white dark:bg-gray-900 rounded-3xl p-4 shadow-sm flex justify-between items-center border border-gray-100 dark:border-gray-800">
            <div className="flex items-center space-x-3">
              <div className="w-10 h-10 bg-gradient-to-tr from-blue-600 to-blue-400 text-white font-bold rounded-2xl flex items-center justify-center text-lg shadow-md shadow-blue-500/20">
                F
              </div>
              <h1 className="text-lg font-black text-gray-900 dark:text-white tracking-tight">
                FitAI <span className="text-blue-600">Pro</span>
              </h1>
            </div>
            <button 
              onClick={() => setDarkMode(!darkMode)}
              className="w-10 h-10 bg-gray-100 dark:bg-gray-800 rounded-2xl flex items-center justify-center text-base"
            >
              {darkMode ? '☀️' : '🌙'}
            </button>
          </header>

          {/* TABS NAVEGACIÓN */}
          <nav className="bg-gray-200/70 dark:bg-gray-800/80 p-1.5 rounded-2xl grid grid-cols-5 gap-1 text-[11px] font-bold">
            {['generar', 'entrenar', 'social', 'crear', 'timer'].map(t => (
              <button 
                key={t}
                onClick={() => setTab(t)}
                className={`py-2 rounded-xl capitalize transition-all text-center ${tab === t ? 'bg-white dark:bg-gray-900 text-gray-900 dark:text-white shadow-sm' : 'text-gray-500'}`}
              >
                {t}
              </button>
            ))}
          </nav>

          {/* CONTENIDO PRINCIPAL */}
          <main className="bg-white dark:bg-gray-900 rounded-3xl p-5 shadow-sm border border-gray-100 dark:border-gray-800 space-y-5">
            
            {/* 1. TAB GENERAR CON IA */}
            {tab === 'generar' && (
              <form onSubmit={handleGenerarRutina} className="space-y-4">
                <div>
                  <h2 className="text-xl font-bold text-gray-900 dark:text-white tracking-tight">Diseña tu Rutina con IA</h2>
                  <p className="text-xs text-gray-400 font-medium leading-relaxed mt-1">La IA analizará tus datos para crear una rutina óptima.</p>
                </div>

                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <label className="block text-[10px] font-bold text-gray-400 tracking-wider uppercase mb-1">Nombre</label>
                    <input 
                      type="text" 
                      value={formData.nombre}
                      onChange={e => setFormData({ ...formData, nombre: e.target.value })}
                      className="w-full p-3 rounded-2xl bg-gray-50 dark:bg-gray-800 border border-transparent dark:border-gray-700 text-xs font-semibold"
                    />
                  </div>
                  <div>
                    <label className="block text-[10px] font-bold text-gray-400 tracking-wider uppercase mb-1">Género</label>
                    <select 
                      value={formData.genero}
                      onChange={e => setFormData({ ...formData, genero: e.target.value })}
                      className="w-full p-3 rounded-2xl bg-gray-50 dark:bg-gray-800 border border-transparent dark:border-gray-700 text-xs font-semibold"
                    >
                      <option value="Hombre">Hombre</option>
                      <option value="Mujer">Mujer</option>
                    </select>
                  </div>
                </div>

                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <label className="block text-[10px] font-bold text-gray-400 tracking-wider uppercase mb-1">Edad</label>
                    <input 
                      type="number" 
                      value={formData.edad}
                      onChange={e => setFormData({ ...formData, edad: e.target.value })}
                      className="w-full p-3 rounded-2xl bg-gray-50 dark:bg-gray-800 border border-transparent dark:border-gray-700 text-xs font-semibold"
                    />
                  </div>
                  <div>
                    <label className="block text-[10px] font-bold text-gray-400 tracking-wider uppercase mb-1">Estatura (cm)</label>
                    <input 
                      type="number" 
                      value={formData.estatura}
                      onChange={e => setFormData({ ...formData, estatura: e.target.value })}
                      className="w-full p-3 rounded-2xl bg-gray-50 dark:bg-gray-800 border border-transparent dark:border-gray-700 text-xs font-semibold"
                    />
                  </div>
                </div>

                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <label className="block text-[10px] font-bold text-gray-400 tracking-wider uppercase mb-1">Objetivo</label>
                    <select 
                      value={formData.objetivo}
                      onChange={e => setFormData({ ...formData, objetivo: e.target.value })}
                      className="w-full p-3 rounded-2xl bg-gray-50 dark:bg-gray-800 border border-transparent dark:border-gray-700 text-xs font-semibold"
                    >
                      <option value="Ganar músculo">Ganar músculo</option>
                      <option value="Perder grasa">Perder grasa</option>
                      <option value="Fuerza">Fuerza</option>
                    </select>
                  </div>
                  <div>
                    <label className="block text-[10px] font-bold text-gray-400 tracking-wider uppercase mb-1">Días por semana</label>
                    <select 
                      value={formData.dias}
                      onChange={e => setFormData({ ...formData, dias: e.target.value })}
                      className="w-full p-3 rounded-2xl bg-gray-50 dark:bg-gray-800 border border-transparent dark:border-gray-700 text-xs font-semibold"
                    >
                      <option value="2 días">2 días</option>
                      <option value="3 días">3 días</option>
                      <option value="4 días">4 días</option>
                      <option value="5 días">5 días</option>
                    </select>
                  </div>
                </div>

                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <label className="block text-[10px] font-bold text-gray-400 tracking-wider uppercase mb-1">Equipo Disponible</label>
                    <select 
                      value={formData.equipo}
                      onChange={e => setFormData({ ...formData, equipo: e.target.value })}
                      className="w-full p-3 rounded-2xl bg-gray-50 dark:bg-gray-800 border border-transparent dark:border-gray-700 text-xs font-semibold"
                    >
                      <option value="Gimnasio completo">Gimnasio completo</option>
                      <option value="Mancuernas">Mancuernas</option>
                      <option value="Calistenia">Calistenia</option>
                    </select>
                  </div>
                  <div>
                    <label className="block text-[10px] font-bold text-gray-400 tracking-wider uppercase mb-1">Duración Sesión</label>
                    <select 
                      value={formData.duracion}
                      onChange={e => setFormData({ ...formData, duracion: e.target.value })}
                      className="w-full p-3 rounded-2xl bg-gray-50 dark:bg-gray-800 border border-transparent dark:border-gray-700 text-xs font-semibold"
                    >
                      <option value="45 min">45 min</option>
                      <option value="60 min">60 min</option>
                    </select>
                  </div>
                </div>

                <div>
                  <label className="block text-[10px] font-bold text-gray-400 tracking-wider uppercase mb-1">Lesiones / Limitaciones</label>
                  <select 
                    value={formData.lesiones}
                    onChange={e => setFormData({ ...formData, lesiones: e.target.value })}
                    className="w-full p-3 rounded-2xl bg-gray-50 dark:bg-gray-800 border border-transparent dark:border-gray-700 text-xs font-semibold"
                  >
                    <option value="Espalda baja (Evitar cargas axiales)">Espalda baja (Evitar cargas axiales)</option>
                    <option value="Rodillas (Evitar gran flexión)">Rodillas (Evitar gran flexión)</option>
                    <option value="Sin lesiones">Sin lesiones</option>
                  </select>
                </div>

                <div>
                  <label className="block text-[10px] font-bold text-gray-400 tracking-wider uppercase mb-1">Nivel</label>
                  <select 
                    value={formData.nivel}
                    onChange={e => setFormData({ ...formData, nivel: e.target.value })}
                    className="w-full p-3 rounded-2xl bg-gray-50 dark:bg-gray-800 border border-transparent dark:border-gray-700 text-xs font-semibold"
                  >
                    <option value="Principiante">Principiante</option>
                    <option value="Intermedio">Intermedio</option>
                    <option value="Avanzado">Avanzado</option>
                  </select>
                </div>

                <button 
                  type="submit" 
                  disabled={loading}
                  className="w-full py-4 bg-gradient-to-r from-blue-700 to-blue-600 hover:from-blue-800 text-white font-black uppercase tracking-wider rounded-2xl text-xs shadow-lg shadow-blue-600/30 transition-all mt-2"
                >
                  {loading ? 'PROCESANDO CON IA...' : 'GENERAR RUTINA CON IA'}
                </button>
              </form>
            )}

            {/* 2. TAB ENTRENAR (Ver la rutina generada por la IA) */}
            {tab === 'entrenar' && (
              <div className="space-y-4">
                {!rutinaActual ? (
                  <div className="text-center py-10 text-gray-400 text-xs">
                    Aún no has creado una rutina. Usa la pestaña <span className="font-bold text-blue-600">Generar</span>.
                  </div>
                ) : (
                  <div className="space-y-4">
                    <div className="flex justify-between items-center">
                      <div>
                        <h3 className="font-extrabold text-base text-gray-900 dark:text-white">Rutina IA de {rutinaActual.usuario}</h3>
                        <p className="text-[10px] text-gray-400">Objetivo: {rutinaActual.objetivo}</p>
                      </div>
                      <span className="px-2.5 py-1 bg-blue-100 dark:bg-blue-900/50 text-blue-600 dark:text-blue-300 font-bold text-[10px] rounded-lg">
                        {rutinaActual.nivel}
                      </span>
                    </div>

                    {rutinaActual.dias.map((dia, diaIdx) => (
                      <div key={diaIdx} className="bg-gray-50 dark:bg-gray-800/50 p-4 rounded-2xl border border-gray-100 dark:border-gray-700 space-y-3">
                        <h4 className="font-bold text-xs text-blue-600">{dia.nombre}</h4>
                        <div className="space-y-2">
                          {dia.ejercicios.map((ej, ejIdx) => (
                            <div key={ejIdx} className="bg-white dark:bg-gray-800 p-2.5 rounded-xl text-xs flex justify-between items-center shadow-sm">
                              <span className="font-semibold text-gray-800 dark:text-gray-100">{ej.nombre}</span>
                              <span className="text-gray-400 text-[10px]">{ej.series} series × {ej.repsBase} reps</span>
                            </div>
                          ))}
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            {/* 3. TAB SOCIAL (Comunidad e Influencers) */}
            {tab === 'social' && (
              <div className="space-y-4">
                <div>
                  <h2 className="text-lg font-extrabold text-gray-900 dark:text-white">Influencers & Comunidad</h2>
                  <p className="text-xs text-gray-400">Combina tu plan IA con consejos y rutinas de creadores.</p>
                </div>

                <div className="flex space-x-3 overflow-x-auto pb-2">
                  {influencers.map(inf => (
                    <div key={inf.id} className="min-w-[130px] bg-gray-50 dark:bg-gray-800 p-3 rounded-2xl border border-gray-100 dark:border-gray-700 flex flex-col items-center text-center space-y-2">
                      <img src={inf.avatar} className="w-10 h-10 rounded-full object-cover" />
                      <div>
                        <p className="font-bold text-xs truncate max-w-[100px]">{inf.nombre}</p>
                        <p className="text-[10px] text-gray-400">{inf.seguidores}</p>
                      </div>
                      <button 
                        onClick={() => toggleFollow(inf.id)}
                        className={`w-full py-1 rounded-xl text-[10px] font-bold ${inf.siguiendo ? 'bg-gray-200 text-gray-700' : 'bg-blue-600 text-white'}`}
                      >
                        {inf.siguiendo ? 'Siguiendo' : 'Seguir'}
                      </button>
                    </div>
                  ))}
                </div>

                <div className="space-y-3">
                  {POSTS_MOCK.map(post => (
                    <div key={post.id} className="p-3.5 rounded-2xl bg-gray-50 dark:bg-gray-800 border border-gray-100 dark:border-gray-700 space-y-2">
                      <div className="flex items-center space-x-2">
                        <img src={post.avatar} className="w-8 h-8 rounded-full object-cover" />
                        <div>
                          <p className="font-bold text-xs">{post.autor}</p>
                          <p className="text-[9px] text-gray-400">{post.tiempo}</p>
                        </div>
                      </div>
                      <p className="text-xs text-gray-700 dark:text-gray-300">{post.texto}</p>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* TAB CREAR Y TIMER */}
            {tab === 'crear' && <div className="text-center py-6 text-xs text-gray-400">Editor manual de rutinas activo.</div>}
            {tab === 'timer' && <div className="text-center py-6 text-xs text-gray-400">Cronómetro e Intervalos HIIT listos.</div>}

          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
