<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>FitAI Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; }
    input[type="number"]::-webkit-inner-spin-button, 
    input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-[#f7f8fa] dark:bg-gray-950 text-gray-900 dark:text-gray-100 min-h-screen pb-20">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- BASE DE DATOS AVANZADA DE EJERCICIOS CON BANDERAS AXIALES Y NIVELES ---
    const DB_AVANZADA = {
      pecho: [
        { nombre: "Press de Banca Plano", musculo: "Pecho", axial: false, media: "https://images.unsplash.com/photo-1571019614242-c5c5dee9f50b?w=400&auto=format&fit=crop&q=80", desc: "Controla la bajada y empuja explosivo." },
        { nombre: "Press Inclinado con Mancuernas", musculo: "Pecho", axial: false, media: "https://images.unsplash.com/photo-1583454110551-21f2fa2afe61?w=400&auto=format&fit=crop&q=80", desc: "Enfócate en la porción clavicular superior." },
        { nombre: "Aperturas en Polea Alta", musculo: "Pecho", axial: false, media: "", desc: "Máxima contracción al centro sin doblar codos." }
      ],
      espalda: [
        { nombre: "Jalón al Pecho en Polea", musculo: "Espalda", axial: false, media: "https://images.unsplash.com/photo-1605296867304-46d5465a13f1?w=400&auto=format&fit=crop&q=80", desc: "Abre el pecho y lleva los codos hacia abajo." },
        { nombre: "Remo con Mancuerna a 1 Mano", musculo: "Espalda", axial: false, media: "https://images.unsplash.com/photo-1581009146145-b5ef050c2e1e?w=400&auto=format&fit=crop&q=80", desc: "Espalda totalmente recta, tracciona hacia la cadera." },
        { nombre: "Remo con Barra Libre", musculo: "Espalda", axial: true, media: "", desc: "Mantén el torso a 45 grados de inclinación." }
      ],
      piernas_cuad: [
        { nombre: "Prensa de Piernas 45°", musculo: "Cuádriceps", axial: false, media: "https://images.unsplash.com/photo-1534367507873-d2d7e24c797f?w=400&auto=format&fit=crop&q=80", desc: "Profundidad completa sin despegar la cadera." },
        { nombre: "Sentadilla Libre con Barra", musculo: "Piernas", axial: true, media: "", desc: "Rompe el paralelo manteniendo el core firme." },
        { nombre: "Extensiones de Cuádriceps", musculo: "Cuádriceps", axial: false, media: "", desc: "Pausa de 1 segundo arriba en máxima extensión." }
      ],
      piernas_post: [
        { nombre: "Hip Thrust con Barra", musculo: "Glúteos", axial: false, media: "https://images.unsplash.com/photo-1574680096145-d05b474e2155?w=400&auto=format&fit=crop&q=80", desc: "Aprieta los glúteos arriba con la mirada al frente." },
        { nombre: "Peso Muerto Rumano", musculo: "Femorales", axial: true, media: "", desc: "Lleva la cadera hacia atrás sintiendo tensión en femoral." },
        { nombre: "Curl Femoral Acostado", musculo: "Femorales", axial: false, media: "", desc: "Evita arquear la espalda al flexionar." }
      ],
      hombros: [
        { nombre: "Press Militar con Mancuernas", musculo: "Hombros", axial: false, media: "", desc: "Empuje vertical controlado sobre la cabeza." },
        { nombre: "Elevaciones Laterales", musculo: "Hombros", axial: false, media: "", desc: "Movimiento estricto guiado por los codos." }
      ],
      brazos: [
        { nombre: "Curl de Bíceps con Barra EZ", musculo: "Brazos", axial: false, media: "", desc: "Evita el balanceo del cuerpo al subir." },
        { nombre: "Extensiones de Tríceps en Polea", musculo: "Brazos", axial: false, media: "", desc: "Codos fijos pegados a los costados." }
      ]
    };

    // --- MOTOR IA INTELIGENTE Y ROBUSTO ---
    const generarRutinaPro = (datos) => {
      const { objetivo, dias, lesiones, nivel, genero } = datos;
      const numDias = parseInt(dias) || 3;
      const evitaAxial = lesiones.includes('Espalda baja');
      const esHombre = genero === 'Hombre';

      // Configuración de series y repeticiones según el nivel seleccionado
      let configNivel = {
        Principiante: { series: 3, reps: objetivo === 'Fuerza' ? '6-8' : '12-15', desc: '90s' },
        Intermedio: { series: 4, reps: objetivo === 'Fuerza' ? '5-6' : '10-12', desc: '60s' },
        Avanzado: { series: 5, reps: objetivo === 'Fuerza' ? '3-5' : '8-10', desc: '45s' }
      }[nivel] || { series: 3, reps: '10-12', desc: '60s' };

      // Filtrar ejercicios si hay lesión de espalda baja
      const filtrar = (lista) => lista.filter(e => !(evitaAxial && e.axial));

      const pool = {
        pecho: filtrar(DB_AVANZADA.pecho),
        espalda: filtrar(DB_AVANZADA.espalda),
        cuad: filtrar(DB_AVANZADA.piernas_cuad),
        post: filtrar(DB_AVANZADA.piernas_post),
        hombros: filtrar(DB_AVANZADA.hombros),
        brazos: filtrar(DB_AVANZADA.brazos)
      };

      // Estructura de días adaptada
      let estructuraDias = [];
      if (numDias === 3) {
        estructuraDias = esHombre ? [
          { nombre: `Día 1: Torso / Énfasis Empuje (${nivel})`, grupos: ['pecho', 'hombros', 'brazos'] },
          { nombre: `Día 2: Piernas Completo (${nivel})`, grupos: ['cuad', 'post'] },
          { nombre: `Día 3: Espalda & Brazos (${nivel})`, grupos: ['espalda', 'brazos'] }
        ] : [
          { nombre: `Día 1: Glúteo & Pierna (${nivel})`, grupos: ['post', 'cuad'] },
          { nombre: `Día 2: Torso & Hombros (${nivel})`, grupos: ['pecho', 'espalda', 'hombros'] },
          { nombre: `Día 3: Cadena Posterior (${nivel})`, grupos: ['post', 'brazos'] }
        ];
      } else {
        estructuraDias = [
          { nombre: `Día 1: Pecho y Tríceps (${nivel})`, grupos: ['pecho', 'brazos'] },
          { nombre: `Día 2: Espalda y Bíceps (${nivel})`, grupos: ['espalda', 'brazos'] },
          { nombre: `Día 3: Tren Inferior (Cuádriceps) (${nivel})`, grupos: ['cuad'] },
          { nombre: `Día 4: Hombros y Glúteos (${nivel})`, grupos: ['hombros', 'post'] }
        ].slice(0, numDias);
      }

      const diasGenerados = estructuraDias.map(dia => {
        let ejerciciosDia = [];
        dia.grupos.forEach(g => {
          const seleccion = pool[g] || pool.pecho;
          seleccion.forEach(item => {
            ejerciciosDia.push({
              nombre: item.nombre,
              musculo: item.musculo,
              media: item.media,
              series: configNivel.series,
              reps: configNivel.reps,
              descanso: configNivel.descanso,
              detalles: item.desc
            });
          });
        });
        return {
          nombre: dia.nombre,
          ejercicios: ejerciciosDia.slice(0, 5) // Máximo 5 ejercicios sólidos por sesión
        };
      });

      return {
        usuario: datos.nombre,
        objetivo: datos.objetivo,
        nivel: nivel,
        dias: diasGenerados
      };
    };

    function App() {
      const [tab, setTab] = useState('generar');
      const [darkMode, setDarkMode] = useState(false);

      useEffect(() => {
        if (darkMode) document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
      }, [darkMode]);

      const [formData, setFormData] = useState({
        nombre: 'Alan', genero: 'Hombre', edad: '24', estatura: '170',
        objetivo: 'Ganar músculo', dias: '3 días', equipo: 'Gimnasio completo',
        duracion: '60 min', lesiones: 'Espalda baja (Evitar cargas axiales)', nivel: 'Intermedio'
      });

      const [rutinaActual, setRutinaActual] = useState(() => {
        return generarRutinaPro({
          nombre: 'Alan', genero: 'Hombre', objetivo: 'Ganar músculo',
          dias: '3 días', lesiones: 'Espalda baja (Evitar cargas axiales)', nivel: 'Intermedio'
        });
      });

      const [loading, setLoading] = useState(false);
      const [sesionActiva, setSesionActiva] = useState(null);
      const [timerCorriendo, setTimerCorriendo] = useState(false);

      const handleGenerar = (e) => {
        e.preventDefault();
        setLoading(true);
        setTimeout(() => {
          const nueva = generarRutinaPro(formData);
          setRutinaActual(nueva);
          setLoading(false);
          setTab('entrenar');
        }, 600);
      };

      const formControlClass = "w-full p-3.5 rounded-2xl bg-[#f4f5f7] dark:bg-gray-800/50 border-none text-[13px] font-medium text-gray-900 dark:text-gray-100 outline-none";
      const labelClass = "block text-[10px] font-extrabold text-[#6b7280] dark:text-gray-400 uppercase tracking-widest mb-1.5 ml-1";

      return (
        <div className="max-w-md mx-auto p-4 space-y-4">
          
          <header className="bg-white dark:bg-gray-900 rounded-[2rem] py-3.5 px-5 shadow-sm border border-gray-100/80 dark:border-gray-800 flex justify-between items-center">
            <div className="flex items-center space-x-3">
              <div className="w-9 h-9 bg-[#2b6ded] text-white font-black rounded-full flex items-center justify-center text-sm shadow-sm">F</div>
              <h1 className="text-[16px] font-black text-gray-900 dark:text-white tracking-tight">FitAI <span className="text-[#2b6ded] font-medium">Pro</span></h1>
            </div>
            <button onClick={() => setDarkMode(!darkMode)} className="w-9 h-9 bg-gray-50 dark:bg-gray-800 rounded-full flex items-center justify-center text-[15px]">
              {darkMode ? '☀️' : '🌙'}
            </button>
          </header>

          <nav className="bg-[#ecedf1] dark:bg-gray-800/60 p-1.5 rounded-2xl flex justify-between text-[11px] font-semibold">
            {['Generar', 'Entrenar', 'Social', 'Crear', 'Timer'].map(t => (
              <button 
                key={t}
                onClick={() => setTab(t.toLowerCase())}
                className={`flex-1 py-2 rounded-xl transition-all ${
                  tab === t.toLowerCase() 
                    ? 'bg-white dark:bg-gray-700 text-gray-900 dark:text-white shadow-sm font-bold' 
                    : 'text-[#6b7280] dark:text-gray-400'
                }`}
              >
                {t}
              </button>
            ))}
          </nav>

          <main className="space-y-4">

            {/* GENERAR CON IA POTENCIADO */}
            {tab === 'generar' && (
              <form onSubmit={handleGenerar} className="bg-white dark:bg-gray-900 rounded-[2rem] p-6 shadow-sm border border-gray-100/80 dark:border-gray-800 space-y-4">
                <div>
                  <h2 className="text-[20px] font-black text-gray-900 dark:text-white">Diseña tu Rutina Inteligente</h2>
                  <p className="text-[12px] text-[#6b7280] mt-1">Generación profesional adaptada a tu nivel físico real.</p>
                </div>

                <div className="grid grid-cols-2 gap-3">
                  <div><label className={labelClass}>NOMBRE</label><input type="text" value={formData.nombre} onChange={e=>setFormData({...formData, nombre: e.target.value})} className={formControlClass} /></div>
                  <div>
                    <label className={labelClass}>NIVEL</label>
                    <select value={formData.nivel} onChange={e=>setFormData({...formData, nivel: e.target.value})} className={formControlClass}>
                      <option>Principiante</option>
                      <option>Intermedio</option>
                      <option>Avanzado</option>
                    </select>
                  </div>
                </div>

                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <label className={labelClass}>OBJETIVO</label>
                    <select value={formData.objetivo} onChange={e=>setFormData({...formData, objetivo: e.target.value})} className={formControlClass}>
                      <option>Ganar músculo</option>
                      <option>Perder grasa</option>
                      <option>Fuerza</option>
                    </select>
                  </div>
                  <div>
                    <label className={labelClass}>DÍAS POR SEMANA</label>
                    <select value={formData.dias} onChange={e=>setFormData({...formData, dias: e.target.value})} className={formControlClass}>
                      <option>3 días</option>
                      <option>4 días</option>
                    </select>
                  </div>
                </div>

                <div>
                  <label className={labelClass}>LESIONES / LIMITACIONES</label>
                  <select value={formData.lesiones} onChange={e=>setFormData({...formData, lesiones: e.target.value})} className={formControlClass}>
                    <option>Espalda baja (Evitar cargas axiales)</option>
                    <option>Sin lesiones</option>
                  </select>
                </div>

                <button type="submit" disabled={loading} className="w-full py-4 rounded-[1.25rem] bg-gradient-to-r from-[#306ee8] to-[#1c4baf] text-white font-extrabold text-[11px] uppercase tracking-widest shadow-md">
                  {loading ? 'ANALIZANDO PERFIL...' : 'GENERAR RUTINA PROFESIONAL'}
                </button>
              </form>
            )}

            {/* ENTRENAR CON RUTINA GENERADA */}
            {tab === 'entrenar' && !sesionActiva && (
              <div className="space-y-4">
                <div className="bg-blue-600/10 border border-blue-500/20 p-4 rounded-2xl flex justify-between items-center">
                  <div>
                    <h3 className="font-extrabold text-[14px] text-blue-600 dark:text-blue-400">Rutina Activa: {rutinaActual.usuario}</h3>
                    <p className="text-[11px] text-gray-500">Nivel: <strong className="uppercase">{rutinaActual.nivel}</strong> • Objetivo: {rutinaActual.objetivo}</p>
                  </div>
                </div>

                {rutinaActual.dias.map((dia, diaIdx) => (
                  <div key={diaIdx} className="bg-white dark:bg-gray-900 rounded-[2rem] p-5 shadow-sm border border-gray-100/80 dark:border-gray-800 space-y-4">
                    <div className="flex justify-between items-center border-b border-gray-100 dark:border-gray-800 pb-3">
                      <h3 className="font-extrabold text-[15px]">{dia.nombre}</h3>
                      <button onClick={() => setSesionActiva(dia)} className="text-[11px] font-bold text-white bg-[#2b6ded] px-3.5 py-1.5 rounded-full shadow-sm">Iniciar</button>
                    </div>
                    <div className="space-y-3">
                      {dia.ejercicios.map((ej, ejIdx) => (
                        <div key={ejIdx} className="bg-[#f7f8fa] dark:bg-gray-800/40 p-3.5 rounded-2xl space-y-1">
                          <div className="flex justify-between items-center">
                            <h4 className="font-bold text-[13px]">{ej.nombre}</h4>
                            <span className="text-[11px] font-bold text-[#2b6ded]">{ej.series} series × {ej.reps}</span>
                          </div>
                          <p className="text-[11px] text-gray-500">{ej.detalles} ({ej.descanso} descanso)</p>
                        </div>
                      ))}
                    </div>
                  </div>
                ))}
              </div>
            )}

            {tab === 'entrenar' && sesionActiva && (
              <div className="bg-white dark:bg-gray-900 rounded-[2rem] p-6 shadow-sm border border-gray-100/80 dark:border-gray-800 space-y-4">
                <h2 className="text-[18px] font-black">Sesión Guiada: {sesionActiva.nombre}</h2>
                <p className="text-xs text-gray-500">Registra tus series y mantén el control de cargas.</p>
                <button onClick={() => setSesionActiva(null)} className="w-full py-3.5 bg-green-600 text-white font-extrabold text-[12px] rounded-2xl">
                  ✓ Finalizar Sesión
                </button>
              </div>
            )}

            {/* PESTAÑA SOCIAL */}
            {tab === 'social' && (
              <div className="space-y-4">
                <div className="bg-white dark:bg-gray-900 rounded-[2rem] p-5 shadow-sm border border-gray-100 dark:border-gray-800 space-y-3">
                  <h3 className="text-[14px] font-black uppercase tracking-wider text-gray-400">Comunidad & Influencers</h3>
                  <div className="flex gap-3 overflow-x-auto pb-2 scrollbar-hide">
                    <div className="flex flex-col items-center space-y-1 min-w-[70px]">
                      <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&auto=format&fit=crop&q=80" className="w-14 h-14 rounded-full object-cover border-2 border-blue-500 p-0.5" />
                      <span className="text-[11px] font-bold">Carlos Coach</span>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {tab === 'crear' && (
              <div className="bg-white dark:bg-gray-900 rounded-[2rem] p-6 shadow-sm border border-gray-100 dark:border-gray-800 space-y-4">
                <h2 className="text-[20px] font-black">Creador Manual</h2>
                <input type="text" placeholder="Nombre de la rutina..." className={formControlClass} />
              </div>
            )}

            {tab === 'timer' && (
              <div className="bg-white dark:bg-gray-900 rounded-[2rem] p-8 shadow-sm border border-gray-100 dark:border-gray-800 text-center space-y-4">
                <span className="text-[10px] font-black text-[#2b6ded] uppercase">PREPÁRATE</span>
                <div className="text-[64px] font-black leading-none">00:45</div>
                <button onClick={()=>setTimerCorriendo(!timerCorriendo)} className="px-7 py-2.5 bg-[#306ee8] text-white font-bold text-[12px] rounded-xl">
                  {timerCorriendo ? 'Pausar' : 'Iniciar'}
                </button>
              </div>
            )}

          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
