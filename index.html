<!DOCTYPE html>
<html lang="es" class="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FitAI Pro - Tu Entrenador Inteligente</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 50: '#f0f9ff', 500: '#0284c7', 600: '#0284c7', 700: '#0369a1' }
          }
        }
      }
    }
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100 min-h-screen transition-colors duration-200">

  <!-- Contenedor Principal -->
  <div class="max-w-xl mx-auto px-4 py-6 space-y-6">

    <!-- Header & Navegación -->
    <header class="flex items-center justify-between bg-white dark:bg-slate-900 p-3 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800">
      <div class="flex items-center space-x-2">
        <div class="w-8 h-8 rounded-xl bg-brand-600 flex items-center justify-center text-white font-black text-sm">F</div>
        <span class="font-bold text-base tracking-tight text-slate-900 dark:text-white">FitAI <span class="text-brand-600">Pro</span></span>
      </div>
      <button onclick="toggleDarkMode()" class="p-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition">
        <span id="theme-icon">🌙</span>
      </button>
    </header>

    <!-- Pestañas de Navegación -->
    <nav class="grid grid-cols-4 gap-1 bg-slate-200/70 dark:bg-slate-900 p-1 rounded-xl text-xs font-semibold">
      <button onclick="switchTab('generar')" id="tab-generar" class="py-2.5 rounded-lg transition bg-white dark:bg-slate-800 text-slate-900 dark:text-white shadow-sm">Generar</button>
      <button onclick="switchTab('guiado')" id="tab-guiado" class="py-2.5 rounded-lg transition text-slate-600 dark:text-slate-400">Entrenar</button>
      <button onclick="switchTab('crear')" id="tab-crear" class="py-2.5 rounded-lg transition text-slate-600 dark:text-slate-400">Crear</button>
      <button onclick="switchTab('timer')" id="tab-timer" class="py-2.5 rounded-lg transition text-slate-600 dark:text-slate-400">Timer</button>
    </nav>

    <!-- PESTAÑA 1: GENERADOR IA CON FORMULARIO AMPLIADO -->
    <section id="sec-generar" class="space-y-5">
      <div class="bg-white dark:bg-slate-900 p-5 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800 space-y-4">
        <div>
          <h2 class="text-lg font-bold text-slate-900 dark:text-white">Diseña tu Rutina Inteligente</h2>
          <p class="text-xs text-slate-500 dark:text-slate-400">Personalización avanzada adaptada a tu cuerpo y equipo.</p>
        </div>

        <form id="form-ia" class="space-y-3">
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-[11px] font-bold text-slate-600 dark:text-slate-400 uppercase tracking-wider mb-1">Nombre</label>
              <input type="text" id="nombre" placeholder="Tu nombre" class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl p-2.5 text-xs focus:outline-none focus:ring-2 focus:ring-brand-500" />
            </div>
            <div>
              <label class="block text-[11px] font-bold text-slate-600 dark:text-slate-400 uppercase tracking-wider mb-1">Género</label>
              <select id="genero" class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl p-2.5 text-xs focus:outline-none focus:ring-2 focus:ring-brand-500">
                <option value="Mujer">Mujer (Énfasis en piernas/glúteos)</option>
                <option value="Hombre">Hombre</option>
              </select>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-[11px] font-bold text-slate-600 dark:text-slate-400 uppercase tracking-wider mb-1">Edad</label>
              <input type="number" id="edad" placeholder="Ej. 28" class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl p-2.5 text-xs focus:outline-none focus:ring-2 focus:ring-brand-500" />
            </div>
            <div>
              <label class="block text-[11px] font-bold text-slate-600 dark:text-slate-400 uppercase tracking-wider mb-1">Estatura (cm)</label>
              <input type="number" id="estatura" placeholder="Ej. 170" class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl p-2.5 text-xs focus:outline-none focus:ring-2 focus:ring-brand-500" />
            </div>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-[11px] font-bold text-slate-600 dark:text-slate-400 uppercase tracking-wider mb-1">Objetivo</label>
              <select id="objetivo" class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl p-2.5 text-xs focus:outline-none focus:ring-2 focus:ring-brand-500">
                <option value="Ganar músculo">Ganar músculo</option>
                <option value="Perder grasa">Perder grasa</option>
                <option value="Fuerza máxima">Fuerza máxima</option>
              </select>
            </div>
            <div>
              <label class="block text-[11px] font-bold text-slate-600 dark:text-slate-400 uppercase tracking-wider mb-1">Días por semana</label>
              <select id="dias" class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl p-2.5 text-xs focus:outline-none focus:ring-2 focus:ring-brand-500">
                <option value="3">3 días</option>
                <option value="4" selected>4 días</option>
                <option value="5">5 días</option>
                <option value="6">6 días</option>
              </select>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-[11px] font-bold text-slate-600 dark:text-slate-400 uppercase tracking-wider mb-1">Equipo Disponible</label>
              <select id="equipo" class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl p-2.5 text-xs focus:outline-none focus:ring-2 focus:ring-brand-500">
                <option value="Gimnasio completo">Gimnasio completo</option>
                <option value="Casa sin equipo">Casa sin equipo (Calistenia)</option>
                <option value="Mancuernas y bandas">Mancuernas y bandas</option>
              </select>
            </div>
            <div>
              <label class="block text-[11px] font-bold text-slate-600 dark:text-slate-400 uppercase tracking-wider mb-1">Duración Sesión</label>
              <select id="duracion" class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl p-2.5 text-xs focus:outline-none focus:ring-2 focus:ring-brand-500">
                <option value="30">30 min</option>
                <option value="45">45 min</option>
                <option value="60" selected>60 min</option>
                <option value="90">90 min</option>
              </select>
            </div>
          </div>

          <div>
            <label class="block text-[11px] font-bold text-slate-600 dark:text-slate-400 uppercase tracking-wider mb-1">Lesiones / Limitaciones</label>
            <select id="lesiones" class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl p-2.5 text-xs focus:outline-none focus:ring-2 focus:ring-brand-500">
              <option value="Ninguna">Ninguna</option>
              <option value="Dolor de Rodilla">Rodilla (Evitar alto impacto)</option>
              <option value="Molestia de Hombro">Hombro (Evitar preses profundos)</option>
              <option value="Dolor de Espalda Baja">Espalda baja (Evitar cargas axiales)</option>
            </select>
          </div>

          <div>
            <label class="block text-[11px] font-bold text-slate-600 dark:text-slate-400 uppercase tracking-wider mb-1">Nivel</label>
            <select id="nivel" class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl p-2.5 text-xs focus:outline-none focus:ring-2 focus:ring-brand-500">
              <option value="Básico">Básico</option>
              <option value="Intermedio" selected>Intermedio</option>
              <option value="Avanzado">Avanzado</option>
            </select>
          </div>

          <button type="submit" id="btn-submit-ia" class="w-full py-3.5 bg-brand-600 hover:bg-brand-700 text-white font-bold text-xs rounded-xl shadow-lg transition uppercase tracking-wider">
            Generar Rutina con IA
          </button>
        </form>
      </div>

      <!-- Estado Carga -->
      <div id="ia-loading" class="hidden text-center py-8 space-y-2">
        <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-brand-600 border-t-transparent"></div>
        <p class="text-xs text-slate-500 font-medium">Diseñando plan estructurado...</p>
      </div>

      <!-- Área de Resultados y Tarjetas -->
      <div id="ia-resultado" class="hidden space-y-4">
        <div id="pdf-export-area" class="space-y-4"></div>
        <button onclick="exportToPDF()" class="w-full py-3 bg-slate-800 hover:bg-slate-700 text-white font-bold text-xs rounded-xl transition flex items-center justify-center gap-2">
          📄 Exportar Rutina a PDF
        </button>
      </div>
    </section>

    <!-- PESTAÑA 2: SESIÓN GUIADA ENTRENAR HOY -->
    <section id="sec-guiado" class="hidden space-y-4">
      <div class="bg-white dark:bg-slate-900 p-5 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800 space-y-4">
        <div class="flex items-center justify-between">
          <h2 class="text-lg font-bold text-slate-900 dark:text-white">Sesión Guiada</h2>
          <span id="guided-step" class="text-xs font-semibold px-2.5 py-1 bg-brand-50 dark:bg-slate-800 text-brand-600 rounded-lg">Paso 1</span>
        </div>

        <div id="guided-content" class="space-y-4">
          <p class="text-xs text-slate-500">Genera una rutina en la pestaña principal para comenzar el modo interactivo de entrenamiento.</p>
        </div>
      </div>
    </section>

    <!-- PESTAÑA 3: CREAR MANUAL + REGISTRO PESOS -->
    <section id="sec-crear" class="hidden space-y-4">
      <div class="bg-white dark:bg-slate-900 p-5 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800 space-y-4">
        <h2 class="text-lg font-bold text-slate-900 dark:text-white">Creador Manual & Pesos</h2>
        <input type="text" id="manual-name" placeholder="Nombre de la rutina (ej. Mi Espalda/Bíceps)" class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl p-2.5 text-xs focus:outline-none" />
        
        <div id="manual-exercises" class="space-y-3"></div>

        <button onclick="addManualExercise()" class="w-full py-2.5 border border-dashed border-slate-300 dark:border-slate-700 rounded-xl text-xs font-bold text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800 transition">
          + Agregar Ejercicio
        </button>
      </div>
    </section>

    <!-- PESTAÑA 4: TIMER CON VOZ INTEGRADO -->
    <section id="sec-timer" class="hidden space-y-4">
      <div class="bg-white dark:bg-slate-900 p-6 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800 text-center space-y-3">
        <span id="timer-state" class="text-xs font-bold uppercase tracking-widest text-brand-600">PREPÁRATE</span>
        <div id="timer-clock" class="text-6xl font-black text-slate-900 dark:text-white tracking-tight">00:45</div>
        <div class="flex justify-center gap-2 pt-2">
          <button onclick="toggleTimer()" id="timer-btn" class="px-6 py-2.5 bg-brand-600 text-white font-bold text-xs rounded-xl shadow-md">Iniciar</button>
          <button onclick="resetTimer()" class="px-6 py-2.5 bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-300 font-bold text-xs rounded-xl">Reiniciar</button>
        </div>
      </div>
    </section>

  </div>

  <!-- LÓGICA DE LA APLICACIÓN -->
  <script>
    let currentRoutine = null;
    let activeExerciseIndex = 0;
    let currentSet = 1;
    let timerInterval = null;
    let timerSeconds = 45;
    let isTimerRunning = false;

    // Conmutación de Modo Claro / Oscuro
    function toggleDarkMode() {
      const html = document.documentElement;
      const icon = document.getElementById('theme-icon');
      if (html.classList.contains('dark')) {
        html.classList.remove('dark');
        icon.innerText = '🌙';
      } else {
        html.classList.add('dark');
        icon.innerText = '☀️';
      }
    }

    // Pestañas
    function switchTab(tab) {
      ['generar', 'guiado', 'crear', 'timer'].forEach(t => {
        document.getElementById(`sec-${t}`).classList.add('hidden');
        const btn = document.getElementById(`tab-${t}`);
        btn.className = "py-2.5 rounded-lg transition text-slate-600 dark:text-slate-400";
      });
      document.getElementById(`sec-${tab}`).classList.remove('hidden');
      document.getElementById(`tab-${tab}`).className = "py-2.5 rounded-lg transition bg-white dark:bg-slate-800 text-slate-900 dark:text-white shadow-sm font-bold";
    }

    // Altavoz con voz
    function speakText(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'es-ES';
        window.speechSynthesis.speak(utterance);
      }
    }

    // Envío del Formulario
    document.getElementById('form-ia').addEventListener('submit', async (e) => {
      e.preventDefault();
      const loading = document.getElementById('ia-loading');
      const resultado = document.getElementById('ia-resultado');
      const container = document.getElementById('pdf-export-area');

      loading.classList.remove('hidden');
      resultado.classList.add('hidden');

      const bodyData = {
        nombre: document.getElementById('nombre').value,
        genero: document.getElementById('genero').value,
        edad: document.getElementById('edad').value,
        estatura: document.getElementById('estatura').value,
        objetivo: document.getElementById('objetivo').value,
        dias: document.getElementById('dias').value,
        equipo: document.getElementById('equipo').value,
        duracion: document.getElementById('duracion').value,
        lesiones: document.getElementById('lesiones').value,
        nivel: document.getElementById('nivel').value
      };

      try {
        const res = await fetch('/api/generar', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(bodyData)
        });

        const data = await res.json();
        if (res.ok && data.dias) {
          currentRoutine = data;
          renderRoutineCards(data, container);
          resultado.classList.remove('hidden');
          setupGuidedSession(data);
        } else {
          alert("Ocurrió un inconveniente al generar. Inténtalo nuevamente.");
        }
      } catch (err) {
        alert("Error de conexión con el servidor.");
      } finally {
        loading.classList.add('hidden');
      }
    });

    // Renders de Tarjetas con Imagen y Botón Cambiar Ejercicio
    function renderRoutineCards(routine, container) {
      let html = '';
      
      // Calentamiento
      if (routine.calentamiento) {
        html += `<div class="bg-amber-50 dark:bg-amber-950/30 border border-amber-200 dark:border-amber-800/50 p-3.5 rounded-xl space-y-1">
          <h4 class="font-bold text-xs text-amber-800 dark:text-amber-400">🔥 Calentamiento Sugerido</h4>
          <ul class="text-xs text-amber-700 dark:text-amber-300 list-disc list-inside">
            ${routine.calentamiento.map(item => `<li>${item}</li>`).join('')}
          </ul>
        </div>`;
      }

      // Días
      routine.dias.forEach((dia, dIdx) => {
        html += `<div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 space-y-3">
          <h3 class="font-bold text-sm text-slate-900 dark:text-white border-b border-slate-100 dark:border-slate-800 pb-2">${dia.nombre}</h3>
          <div class="space-y-3">`;

        dia.ejercicios.forEach((ex, eIdx) => {
          html += `<div class="bg-slate-50 dark:bg-slate-800/50 p-3 rounded-xl space-y-2 border border-slate-100 dark:border-slate-800">
            <div class="flex gap-3">
              <img src="${ex.img}" alt="${ex.nombre}" class="w-16 h-16 rounded-lg object-cover flex-shrink-0 bg-slate-200" />
              <div class="flex-1 space-y-0.5">
                <div class="flex justify-between items-start">
                  <h4 class="font-bold text-xs text-slate-900 dark:text-white">${ex.nombre}</h4>
                  <button onclick="swapExercise(${dIdx}, ${eIdx})" class="text-[10px] text-brand-600 font-semibold hover:underline">🔄 Cambiar</button>
                </div>
                <p class="text-[10px] font-medium text-brand-600 dark:text-brand-400">${ex.musculo}</p>
                <p class="text-[11px] font-bold text-slate-700 dark:text-slate-300">${ex.series} series x ${ex.reps} reps (${ex.descansoSeg}s desc)</p>
              </div>
            </div>
            <div class="text-[10px] text-slate-500 dark:text-slate-400 space-y-0.5 border-t border-slate-200/50 dark:border-slate-700/50 pt-1.5">
              <p><strong>Ejecución:</strong> ${ex.pasos}</p>
              <p><strong class="text-rose-500">Error común:</strong> ${ex.errores}</p>
            </div>
          </div>`;
        });

        html += `</div></div>`;
      });

      // Estiramiento
      if (routine.estiramiento) {
        html += `<div class="bg-emerald-50 dark:bg-emerald-950/30 border border-emerald-200 dark:border-emerald-800/50 p-3.5 rounded-xl space-y-1">
          <h4 class="font-bold text-xs text-emerald-800 dark:text-emerald-400">🧘 Estiramiento Final</h4>
          <ul class="text-xs text-emerald-700 dark:text-emerald-300 list-disc list-inside">
            ${routine.estiramiento.map(item => `<li>${item}</li>`).join('')}
          </ul>
        </div>`;
      }

      container.innerHTML = html;
    }

    // Intercambiar un ejercicio por otro equivalente
    function swapExercise(dayIdx, exIdx) {
      if (!currentRoutine) return;
      const ex = currentRoutine.dias[dayIdx].ejercicios[exIdx];
      
      const alternativas = [
        { nombre: "Press Inclinado con Mancuernas", musculo: ex.musculo, pasos: "Baja controlado hasta rozar el pecho y empuja.", errores: "No bloquear los codos bruscamente." },
        { nombre: "Polea Alta Abierta", musculo: ex.musculo, pasos: "Lleva la barra hacia la parte superior del pecho.", errores: "Balancear la espalda en exceso." },
        { nombre: "Zancadas Búlgaras", musculo: ex.musculo, pasos: "Desciende de forma vertical apoyando el pie trasero en banco.", errores: "Inclinarse demasiado hacia adelante." }
      ];

      const alt = alternativas[Math.floor(Math.random() * alternativas.length)];
      currentRoutine.dias[dayIdx].ejercicios[exIdx] = {
        ...ex,
        nombre: alt.nombre,
        pasos: alt.pasos,
        errores: alt.errores
      };

      renderRoutineCards(currentRoutine, document.getElementById('pdf-export-area'));
    }

    // Configurar Sesión Guiada
    function setupGuidedSession(routine) {
      const container = document.getElementById('guided-content');
      const allExercises = [];
      routine.dias.forEach(d => allExercises.push(...d.ejercicios));

      if (allExercises.length === 0) return;

      const ex = allExercises[activeExerciseIndex];
      container.innerHTML = `
        <div class="space-y-3">
          <img src="${ex.img}" class="w-full h-40 rounded-xl object-cover" />
          <div>
            <h3 class="font-black text-base text-slate-900 dark:text-white">${ex.nombre}</h3>
            <p class="text-xs text-brand-600 font-bold">${ex.musculo}</p>
          </div>
          <div class="flex justify-between items-center bg-slate-100 dark:bg-slate-800 p-3 rounded-xl">
            <span class="text-xs font-bold text-slate-600 dark:text-slate-300">Serie ${currentSet} de ${ex.series}</span>
            <span class="text-xs font-bold text-slate-900 dark:text-white">${ex.reps} Repeticiones</span>
          </div>
          <button onclick="completeSet(${ex.descansoSeg})" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs rounded-xl shadow-md transition">
            ✓ Completar Serie y Descansar
          </button>
        </div>
      `;
    }

    function completeSet(descanso) {
      speakText(`Serie completada. Descansa ${descanso} segundos`);
      timerSeconds = descanso;
      switchTab('timer');
      resetTimer();
      toggleTimer();
    }

    // Exportar a PDF
    function exportToPDF() {
      const element = document.getElementById('pdf-export-area');
      html2pdf().from(element).set({
        margin: 10,
        filename: 'Mi_Rutina_FitAI.pdf',
        html2canvas: { scale: 2 },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
      }).save();
    }

    // Lógica del Timer
    function toggleTimer() {
      const btn = document.getElementById('timer-btn');
      if (isTimerRunning) {
        clearInterval(timerInterval);
        isTimerRunning = false;
        btn.innerText = 'Iniciar';
      } else {
        isTimerRunning = true;
        btn.innerText = 'Pausar';
        timerInterval = setInterval(() => {
          if (timerSeconds > 0) {
            timerSeconds--;
            updateTimerUI();
          } else {
            clearInterval(timerInterval);
            isTimerRunning = false;
            btn.innerText = 'Iniciar';
            speakText("¡Tiempo de descanso terminado! Siguiente serie.");
          }
        }, 1000);
      }
    }

    function resetTimer() {
      clearInterval(timerInterval);
      isTimerRunning = false;
      document.getElementById('timer-btn').innerText = 'Iniciar';
      updateTimerUI();
    }

    function updateTimerUI() {
      const mins = String(Math.floor(timerSeconds / 60)).padStart(2, '0');
      const secs = String(timerSeconds % 60).padStart(2, '0');
      document.getElementById('timer-clock').innerText = `${mins}:${secs}`;
    }

    // Creador Manual Dinámico
    function addManualExercise() {
      const container = document.getElementById('manual-exercises');
      const div = document.createElement('div');
      div.className = "flex gap-2 items-center bg-slate-50 dark:bg-slate-800 p-2.5 rounded-xl";
      div.innerHTML = `
        <input type="text" placeholder="Ejercicio" class="flex-1 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg p-2 text-xs focus:outline-none" />
        <input type="number" placeholder="Kg" class="w-16 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg p-2 text-xs focus:outline-none" />
        <input type="number" placeholder="Reps" class="w-16 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg p-2 text-xs focus:outline-none" />
        <button onclick="this.parentElement.remove()" class="text-rose-500 font-bold px-2">✕</button>
      `;
      container.appendChild(div);
    }
  </script>
