<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>FitAI Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; }
    input[type="number"]::-webkit-inner-spin-button, 
    input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-[#f7f8fa] dark:bg-gray-950 text-gray-900 dark:text-gray-100 min-h-screen pb-16">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // BANCO DE DATOS CON LAS IMÁGENES EXACTAS DE TUS CAPTURAS
    const DB_EJERCICIOS = {
      pecho: [
        { 
          id: 'press_banca_mancuerna', 
          nombre: "Press de Banca con Mancuernas", 
          musculo: "Pecho", 
          media: "https://images.unsplash.com/photo-1583454110551-21f2fa2afe61?w=400&auto=format&fit=crop&q=80", 
          ejecucion: "Mantén el torso estable y controla la fase descendente.", 
          error: "Perder la postura o acelerar demasiado." 
        }
      ],
      espalda: [
        { 
          id: 'remo_mancuerna', 
          nombre: "Remo con Mancuerna", 
          musculo: "Espalda", 
          media: "https://images.unsplash.com/photo-1581009146145-b5ef050c2e1e?w=400&auto=format&fit=crop&q=80", 
          ejecucion: "Tracciona llevando el codo hacia la cadera manteniendo la espalda recta.", 
          error: "Rotar en exceso el torso." 
        }
      ],
      piernas_post: [
        { 
          id: 'hip_thrust', 
          nombre: "Empuje de Cadera con Barra (Hip Thrust)", 
          musculo: "Glúteos", 
          media: "https://images.unsplash.com/photo-1574680096145-d05b474e2155?w=400&auto=format&fit=crop&q=80", 
          ejecucion: "Empuja con los talones y aprieta glúteos arriba sosteniendo el pico de contracción.", 
          error: "Arquear la zona lumbar." 
        }
      ]
    };

    function App() {
      const [tab, setTab] = useState('generar');
      const [darkMode, setDarkMode] = useState(false);

      useEffect(() => {
        if (darkMode) document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
      }, [darkMode]);

      // FORMULARIO DE GENERADOR IA (IDENTICO A TU CAPTURA 1)
      const [formData, setFormData] = useState({
        nombre: 'Alan', genero: 'Hombre', edad: '24', estatura: '170',
        objetivo: 'Ganar músculo', dias: '3 días', equipo: 'Gimnasio completo',
        duracion: '60 min', lesiones: 'Espalda baja (Evitar cargas axiales)', nivel: 'Intermedio'
      });
      const [loading, setLoading] = useState(false);

      // RUTINA PREDETERMINADA QUE COINCIDE CON TU CAPTURA DE DÍA 1 Y DÍA 2
      const [rutinaActual, setRutinaActual] = useState({
        usuario: 'Alan',
        objetivo: 'Ganar músculo',
        dias: [
          {
            nombre: "Día 1: Sesión Personalizada",
            ejercicios: [
              { ...DB_EJERCICIOS.pecho[0], series: 4, repsBase: "10-12 reps (60s desc)" },
              { ...DB_EJERCICIOS.espalda[0], series: 4, repsBase: "10-12 reps (60s desc)" }
            ]
          },
          {
            nombre: "Día 2: Sesión Personalizada",
            ejercicios: [
              { ...DB_EJERCICIOS.pecho[0], series: 4, repsBase: "10-12 reps (60s desc)" },
              { ...DB_EJERCICIOS.espalda[0], series: 4, repsBase: "10-12 reps (60s desc)" }
            ]
          }
        ]
      });

      // ENTRENAMIENTO GUIADO (COINCIDE CON TU CAPTURA "SESIÓN GUIADA - PASO 1")
      const [sesionActiva, setSesionActiva] = useState(null);

      // ESTADO CREADOR MANUAL (COINCIDE CON TU CAPTURA "CREADOR MANUAL & PESOS")
      const [rutinaNueva, setRutinaNueva] = useState({ titulo: '', dias: [] });

      // TIMER ESTADO
      const [timerSegs, setTimerSegs] = useState(45);
      const [timerCorriendo, setTimerCorriendo] = useState(false);

      const formControlClass = "w-full p-3.5 rounded-2xl bg-[#f4f5f7] dark:bg-gray-800/50 border-none text-[13px] font-medium text-gray-900 dark:text-gray-100 focus:ring-2 focus:ring-blue-500 transition-all outline-none appearance-none";
      const labelClass = "block text-[10px] font-extrabold text-[#6b7280] dark:text-gray-400 uppercase tracking-widest mb-1.5 ml-1";

      return (
        <div className="max-w-md mx-auto p-4 space-y-4">
          
          {/* ENCABEZADO PROI (IGUAL A TODAS TUS CAPTURAS) */}
          <header className="bg-white dark:bg-gray-900 rounded-[2rem] py-3.5 px-5 shadow-[0_2px_10px_rgba(0,0,0,0.02)] border border-gray-100/80 dark:border-gray-800 flex justify-between items-center">
            <div className="flex items-center space-x-3">
              <div className="w-9 h-9 bg-[#2b6ded] text-white font-black rounded-full flex items-center justify-center text-sm shadow-sm">
                F
              </div>
              <h1 className="text-[16px] font-black text-gray-900 dark:text-white tracking-tight">
                FitAI <span className="text-[#2b6ded] font-medium">Pro</span>
              </h1>
            </div>
            <button 
              onClick={() => setDarkMode(!darkMode)}
              className="w-9 h-9 bg-gray-50 dark:bg-gray-800 rounded-full flex items-center justify-center text-[15px]"
            >
              {darkMode ? '☀️' : '🌙'}
            </button>
          </header>

          {/* BARRA DE NAVEGACIÓN EN PÍLDORA UNIFICADA */}
          <nav className="bg-[#ecedf1] dark:bg-gray-800/60 p-1.5 rounded-2xl flex justify-between text-[12px] font-semibold">
            {['Generar', 'Entrenar', 'Crear', 'Timer'].map(t => (
              <button 
                key={t}
                onClick={() => setTab(t.toLowerCase())}
                className={`flex-1 py-2 rounded-xl transition-all ${
                  tab === t.toLowerCase() 
                    ? 'bg-white dark:bg-gray-700 text-gray-900 dark:text-white shadow-[0_2px_8px_rgba(0,0,0,0.04)] font-bold' 
                    : 'text-[#6b7280] dark:text-gray-400'
                }`}
              >
                {t}
              </button>
            ))}
          </nav>

          {/* CONTENEDOR DE CONTENIDO */}
          <main className="space-y-4">

            {/* VISTA 1: GENERAR (CAPTURA 1) */}
            {tab === 'generar' && (
              <div className="bg-white dark:bg-gray-900 rounded-[2rem] p-6 shadow-[0_4px_20px_rgba(0,0,0,0.02)] border border-gray-100/80 dark:border-gray-800 space-y-4">
                <div>
                  <h2 className="text-[20px] font-black text-gray-900 dark:text-white tracking-tight">Diseña tu Rutina Inteligente</h2>
                  <p className="text-[12px] text-[#6b7280] mt-1 leading-relaxed">Personalización avanzada adaptada a tu cuerpo y equipo.</p>
                </div>

                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <label className={labelClass}>NOMBRE</label>
                    <input type="text" value={formData.nombre} onChange={e=>setFormData({...formData, nombre: e.target.value})} className={formControlClass} />
                  </div>
                  <div className="relative">
                    <label className={labelClass}>GÉNERO</label>
                    <select value={formData.genero} onChange={e=>setFormData({...formData, genero: e.target.value})} className={formControlClass}>
                      <option>Hombre</option><option>Mujer</option>
                    </select>
                    <div className="absolute right-4 bottom-3.5 pointer-events-none text-gray-400 text-[10px]">hat</div>
                  </div>
                </div>

                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <label className={labelClass}>EDAD</label>
                    <input type="number" value={formData.edad} onChange={e=>setFormData({...formData, edad: e.target.value})} className={formControlClass} />
                  </div>
                  <div>
                    <label className={labelClass}>ESTATURA (CM)</label>
                    <input type="number" value={formData.estatura} onChange={e=>setFormData({...formData, estatura: e.target.value})} className={formControlClass} />
                  </div>
                </div>

                <div className="grid grid-cols-2 gap-3">
                  <div className="relative">
                    <label className={labelClass}>OBJETIVO</label>
                    <select value={formData.objetivo} onChange={e=>setFormData({...formData, objetivo: e.target.value})} className={formControlClass}>
                      <option>Ganar músculo</option><option>Perder grasa</option>
                    </select>
                    <div className="absolute right-4 bottom-3.5 pointer-events-none text-gray-400 text-[10px]">hat</div>
                  </div>
                  <div className="relative">
                    <label className={labelClass}>DÍAS POR SEMANA</label>
                    <select value={formData.dias} onChange={e=>setFormData({...formData, dias: e.target.value})} className={formControlClass}>
                      <option>3 días</option><option>4 días</option>
                    </select>
                    <div className="absolute right-4 bottom-3.5 pointer-events-none text-gray-400 text-[10px]">hat</div>
                  </div>
                </div>

                <div className="grid grid-cols-2 gap-3">
                  <div className="relative">
                    <label className={labelClass}>EQUIPO DISPONIBLE</label>
                    <select value={formData.equipo} onChange={e=>setFormData({...formData, equipo: e.target.value})} className={formControlClass}>
                      <option>Gimnasio completo</option>
                    </select>
                    <div className="absolute right-4 bottom-3.5 pointer-events-none text-gray-400 text-[10px]">hat</div>
                  </div>
                  <div className="relative">
                    <label className={labelClass}>DURACIÓN SESIÓN</label>
                    <select value={formData.duracion} onChange={e=>setFormData({...formData, duracion: e.target.value})} className={formControlClass}>
                      <option>60 min</option>
                    </select>
                    <div className="absolute right-4 bottom-3.5 pointer-events-none text-gray-400 text-[10px]">hat</div>
                  </div>
                </div>

                <div className="relative">
                  <label className={labelClass}>LESIONES / LIMITACIONES</label>
                  <select value={formData.lesiones} onChange={e=>setFormData({...formData, lesiones: e.target.value})} className={formControlClass}>
                    <option>Espalda baja (Evitar cargas axiales)</option>
                  </select>
                  <div className="absolute right-4 bottom-3.5 pointer-events-none text-gray-400 text-[10px]">hat</div>
                </div>

                <div className="relative">
                  <label className={labelClass}>NIVEL</label>
                  <select value={formData.nivel} onChange={e=>setFormData({...formData, nivel: e.target.value})} className={formControlClass}>
                    <option>Intermedio</option>
                  </select>
                  <div className="absolute right-4 bottom-3.5 pointer-events-none text-gray-400 text-[10px]">hat</div>
                </div>

                <button onClick={() => setTab('entrenar')} className="w-full mt-2 py-4 rounded-[1.25rem] bg-gradient-to-r from-[#306ee8] to-[#1c4baf] text-white font-extrabold text-[11px] uppercase tracking-widest shadow-[0_8px_16px_rgba(48,110,232,0.25)]">
                  GENERAR RUTINA CON IA
                </button>
              </div>
            )}

            {/* VISTA 2: ENTRENAR (TARJETAS DESGLOSADAS IGUAL A CAPTURA 3 Y 4) */}
            {tab === 'entrenar' && !sesionActiva && (
              <div className="space-y-4">
                {rutinaActual.dias.map((dia, diaIdx) => (
                  <div key={diaIdx} className="bg-white dark:bg-gray-900 rounded-[2rem] p-5 shadow-[0_2px_10px_rgba(0,0,0,0.02)] border border-gray-100/80 dark:border-gray-800 space-y-4">
                    <div className="flex justify-between items-center border-b border-gray-100 dark:border-gray-800 pb-3">
                      <h3 className="font-extrabold text-[16px] text-gray-900 dark:text-white">{dia.nombre}</h3>
                      <button onClick={() => setSesionActiva(dia)} className="text-[11px] font-bold text-[#2b6ded] bg-blue-50 dark:bg-blue-900/30 px-3 py-1 rounded-full">
                        Iniciar Sesión
                      </button>
                    </div>

                    <div className="space-y-3">
                      {dia.ejercicios.map((ej, ejIdx) => (
                        <div key={ejIdx} className="bg-[#f7f8fa] dark:bg-gray-800/40 p-3.5 rounded-2xl space-y-2 border border-gray-100/50 dark:border-gray-800">
                          <div className="flex gap-3 items-center">
                            <img src={ej.media} className="w-16 h-16 object-cover rounded-2xl bg-gray-200" />
                            <div className="flex-1">
                              <div className="flex justify-between items-start">
                                <h4 className="font-bold text-[13px] text-gray-900 dark:text-gray-100 leading-snug">{ej.nombre}</h4>
                                <button className="text-[10px] font-bold text-[#2b6ded] flex items-center gap-1">
                                  🔄 Cambiar
                                </button>
                              </div>
                              <span className="text-[11px] font-bold text-[#2b6ded] block mt-0.5">{ej.musculo}</span>
                              <span className="text-[11px] font-semibold text-gray-500 block mt-0.5">{ej.series} series x {ej.repsBase}</span>
                            </div>
                          </div>

                          <div className="pt-1 text-[11px] text-gray-500 leading-relaxed border-t border-gray-200/50 dark:border-gray-700/50">
                            <p><strong>Ejecución:</strong> {ej.ejecucion}</p>
                            <p className="text-red-500 mt-0.5"><strong>Error común:</strong> {ej.error}</p>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                ))}
              </div>
            )}

            {/* VISTA ENTRENAMIENTO ACTIVO (CAPTURA 4: "SESIÓN GUIADA - PASO 1") */}
            {tab === 'entrenar' && sesionActiva && (
              <div className="bg-white dark:bg-gray-900 rounded-[2rem] p-6 shadow-[0_4px_20px_rgba(0,0,0,0.02)] border border-gray-100/80 dark:border-gray-800 space-y-4">
                <div className="flex justify-between items-center">
                  <h2 className="text-[18px] font-black text-gray-900 dark:text-white">Sesión Guiada</h2>
                  <span className="px-3 py-1 bg-blue-50 text-[#2b6ded] font-bold text-[11px] rounded-full">Paso 1</span>
                </div>

                <img src={DB_EJERCICIOS.piernas_post[0].media} className="w-full h-44 object-cover rounded-2xl bg-gray-100" />

                <div>
                  <h3 className="font-black text-[15px] text-gray-900 dark:text-white leading-snug">
                    {DB_EJERCICIOS.piernas_post[0].nombre}
                  </h3>
                  <span className="text-[11px] font-bold text-[#2b6ded] block mt-0.5">{DB_EJERCICIOS.piernas_post[0].musculo}</span>
                </div>

                <div className="bg-[#f7f8fa] dark:bg-gray-800/40 p-3.5 rounded-2xl flex items-center justify-between text-[12px]">
                  <span className="font-semibold text-gray-500">Serie 1 de 4</span>
                  <span className="font-bold text-gray-900 dark:text-white">10 + 10 seg sosteniendo arriba + 10 reps</span>
                </div>

                <button onClick={() => setSesionActiva(null)} className="w-full py-3.5 bg-[#3c9066] text-white font-extrabold text-[12px] rounded-2xl shadow-md flex items-center justify-center gap-1.5">
                  ✓ Completar Serie y Descansar
                </button>
              </div>
            )}

            {/* VISTA 3: CREAR (CAPTURA 2: "CREADOR MANUAL & PESOS") */}
            {tab === 'crear' && (
              <div className="bg-white dark:bg-gray-900 rounded-[2rem] p-6 shadow-[0_4px_20px_rgba(0,0,0,0.02)] border border-gray-100/80 dark:border-gray-800 space-y-4">
                <h2 className="text-[20px] font-black text-gray-900 dark:text-white tracking-tight">Creador Manual & Pesos</h2>
                
                <div>
                  <input type="text" placeholder="Nombre de la rutina (ej. Mi Espalda/Bíceps)" className={formControlClass} />
                </div>

                <div className="border-2 border-dashed border-gray-200 dark:border-gray-800 rounded-2xl p-4 text-center">
                  <button className="text-[12px] font-bold text-gray-700 dark:text-gray-300">
                    + Agregar Ejercicio
                  </button>
                </div>
              </div>
            )}

            {/* VISTA 4: TIMER (CAPTURA 5) */}
            {tab === 'timer' && (
              <div className="bg-white dark:bg-gray-900 rounded-[2rem] p-8 shadow-[0_4px_20px_rgba(0,0,0,0.02)] border border-gray-100/80 dark:border-gray-800 text-center space-y-4">
                <span className="text-[10px] font-black tracking-widest text-[#2b6ded] uppercase block">PREPÁRATE</span>
                <div className="text-[64px] font-black tracking-tight text-gray-900 dark:text-white leading-none">00:45</div>
                
                <div className="flex gap-3 justify-center pt-2">
                  <button onClick={()=>setTimerCorriendo(!timerCorriendo)} className="px-7 py-2.5 bg-[#306ee8] text-white font-bold text-[12px] rounded-xl shadow-sm">
                    {timerCorriendo ? 'Pausar' : 'Iniciar'}
                  </button>
                  <button onClick={()=>setTimerSegs(45)} className="px-6 py-2.5 bg-[#ecedf1] dark:bg-gray-800 text-gray-700 dark:text-gray-300 font-bold text-[12px] rounded-xl">
                    Reiniciar
                  </button>
                </div>
              </div>
            )}

          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
