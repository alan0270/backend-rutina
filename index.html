<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>FitAI Pro - Motor Dinámico IA</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] } } }
    }
  </script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; }
  </style>
</head>
<body class="bg-[#f7f8fa] dark:bg-gray-950 text-gray-900 dark:text-gray-100 min-h-screen pb-24">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [tab, setTab] = useState('generar');
      const [darkMode, setDarkMode] = useState(false);

      useEffect(() => {
        if (darkMode) document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
      }, [darkMode]);

      const [formData, setFormData] = useState({
        nombre: 'Atleta Pro',
        genero: 'Hombre',
        dia: 'Lunes',
        objetivo: 'Hipertrofia & Fuerza Aplicada',
        descanso: '90 segundos'
      });

      const [rutinaActual, setRutinaActual] = useState({
        titulo: "Programa Generado por IA - Hombre (Lunes)",
        bloques: [
          {
            bloque: "Lunes - Bloque 1: Pectorales y Fuerza",
            ejercicios: [
              { nombre: "Press Banco Plano", series: "1x30 + 4x15 reps", desc: "1 serie de entrada en calor de 30 repeticiones + 4 efectivas. Controla bajada en 2s." },
              { nombre: "Press Banco Inclinado", series: "4 x 15 reps", desc: "Banco ajustado a 30°-45°. Descenso controlado hasta rozar la parte alta del pecho." }
            ]
          }
        ]
      });

      const [loading, setLoading] = useState(false);
      const [sesionActiva, setSesionActiva] = useState(null);

      const generarRutinaConIA = (e) => {
        e.preventDefault();
        setLoading(true);

        setTimeout(() => {
          let bloquesGenerados = [];
          const g = formData.genero;
          const d = formData.dia;

          if (g === 'Hombre') {
            if (d === 'Lunes') {
              bloquesGenerados = [
                {
                  bloque: "Lunes - Bloque 1: Pectorales",
                  ejercicios: [
                    { nombre: "Press Banco Plano", series: "1x30 + 4x15 reps", desc: "1 serie de activación + 4 efectivas. Controla bajada en 2s." },
                    { nombre: "Press Banco Inclinado", series: "4 x 15 reps", desc: "Banco a 30°-45°. Descenso controlado hasta el pecho alto." },
                    { nombre: "Biserie: Aperturas + Flexiones", series: "4 x 15 + Fallo", desc: "15 aperturas con mancuernas + push-ups al fallo muscular." }
                  ]
                },
                {
                  bloque: "Lunes - Bloque 2: Hombros & Tríceps",
                  ejercicios: [
                    { nombre: "Press Militar", series: "4 x 15 reps", desc: "Empuje vertical estricto con abdomen contraído." },
                    { nombre: "Tríceps con Soga en Polea", series: "4 x 15 reps", desc: "Extensión completa abriendo la soga al final." }
                  ]
                }
              ];
            } else if (d === 'Martes') {
              bloquesGenerados = [
                {
                  bloque: "Martes - Bloque 1: Espalda & Tracción",
                  ejercicios: [
                    { nombre: "Jalón al Pecho", series: "1x30 + 4x15 reps", desc: "Agarre ancho prono. Lleva la barra al esternón." },
                    { nombre: "Remo en Máquina", series: "4 x 12 reps", desc: "Apoya el pecho firmemente contra el cojín." },
                    { nombre: "Remo Unilateral", series: "4 x 15 reps (p/lado)", desc: "Tracción en trayectoria diagonal hacia la cadera." }
                  ]
                },
                {
                  bloque: "Martes - Bloque 2: Bíceps & Antebrazo",
                  ejercicios: [
                    { nombre: "Curl con Barra Z", series: "4 x 15 reps", desc: "Evita el balanceo del torso al subir." },
                    { nombre: "Curl Martillo con Mancuernas", series: "4 x 15 reps", desc: "Agarre neutro enfocado en el braquial." }
                  ]
                }
              ];
            } else if (d === 'Miércoles') {
              bloquesGenerados = [
                {
                  bloque: "Miércoles - Bloque 1: Pierna Completa & Fuerza",
                  ejercicios: [
                    { nombre: "Sentadilla Libre", series: "1x30 + 4 x 12 reps", desc: "Profundidad paralela con control absoluto del core." },
                    { nombre: "Prensa de Piernas 45°", series: "4 x 15 reps", desc: "Colocación media de pies para énfasis global." },
                    { nombre: "Peso Muerto Rumano", series: "4 x 12 reps", desc: "Mantén la espalda neutra y estira la cadera hacia atrás." }
                  ]
                }
              ];
            } else if (d === 'Jueves') {
              bloquesGenerados = [
                {
                  bloque: "Jueves - Bloque 1: Hipertrofia de Hombros",
                  ejercicios: [
                    { nombre: "Press Arnold", series: "4 x 15 reps", desc: "Rotación fluida durante el empuje vertical." },
                    { nombre: "Vuelos Laterales en Polea", series: "4 x 15 reps", desc: "Tensión constante en todo el rango de movimiento." },
                    { nombre: "Pájaros con Mancuerna", series: "4 x 15 reps", desc: "Enfoque estricto en el deltoides posterior." }
                  ]
                }
              ];
            } else {
              bloquesGenerados = [
                {
                  bloque: "Viernes - Bloque 1: Brazos & Core Avanzado",
                  ejercicios: [
                    { nombre: "Press Francés con Mancuernas", series: "4 x 15 reps", desc: "Codos fijos apuntando al frente." },
                    { nombre: "Curl Predicador", series: "4 x 15 reps", desc: "Contracción máxima en el punto de flexión." },
                    { nombre: "Plancha Abdominal Isométrica", series: "4 x 60 segundos", desc: "Activación profunda de la faja abdominal." }
                  ]
                }
              ];
            }
          } else {
            if (d === 'Lunes') {
              bloquesGenerados = [
                {
                  bloque: "Lunes - Bloque 1: Dominancia Cuádriceps",
                  ejercicios: [
                    { nombre: "Extensión de cuádriceps", series: "4 series (30/20/15/15)", desc: "Pirámide ascendente de carga. 1s de pausa isométrica arriba." },
                    { nombre: "Prensa inclinada", series: "4 x 15 reps + 10s isometría", desc: "Sostén la carga a la mitad (90°) durante 10 segundos al finalizar." },
                    { nombre: "Sentadilla Hack", series: "4 x 15 reps + 10s isometría", desc: "Rango profundo con sostenimiento estático al centro." }
                  ]
                },
                {
                  bloque: "Lunes - Bloque 2: Tensión Glúteos",
                  ejercicios: [
                    { nombre: "Empuje de cadera (Barra)", series: "4 x (10 + 10s + 10)", desc: "10 reps + 10s isometría arriba + 10 reps de remate continuo." },
                    { nombre: "Patada de glúteo Tri-Serie", series: "4 x (15+15+15)", desc: "15 posteriores + 15 laterales + 15 diagonales sin descanso." }
                  ]
                }
              ];
            } else if (d === 'Martes') {
              bloquesGenerados = [
                {
                  bloque: "Martes - Bloque 1: Tren Superior & Core",
                  ejercicios: [
                    { nombre: "Jalón Polea Alta", series: "4 x 15 reps", desc: "Control total en la fase excéntrica bajando en 3 segundos." },
                    { nombre: "Press de Hombros Mancuernas", series: "4 x 15 reps", desc: "Movimiento fluido sin bloquear codos por completo." },
                    { nombre: "Remo en Polea Baja", series: "4 x 15 reps", desc: "Apertura de pecho y retracción escapular limpia." }
                  ]
                }
              ];
            } else if (d === 'Miércoles') {
              bloquesGenerados = [
                {
                  bloque: "Miércoles - Bloque 1: Glúteos & Isquiosurales",
                  ejercicios: [
                    { nombre: "Peso Muerto Sumo", series: "4 x 15 reps", desc: "Postura amplia con énfasis en glúteo mayor e interno." },
                    { nombre: "Curl Femoral Acostado", series: "4 x 15 reps + 10s isometría", desc: "Sostén isométrico al contraer los isquiotibiales." },
                    { nombre: "Hip Thrust en Máquina", series: "4 x 20 reps (Lentas)", desc: "Cadencia controlada apretando 2s arriba." }
                  ]
                }
              ];
            } else if (d === 'Jueves') {
              bloquesGenerados = [
                {
                  bloque: "Jueves - Bloque 1: Enfoque Cuádriceps Funcional",
                  ejercicios: [
                    { nombre: "Sentadilla Búlgara", series: "4 x 12 reps (p/pierna)", desc: "Torso ligeramente inclinado para reclutar cuádriceps." },
                    { nombre: "Zancadas Estáticas con Salto", series: "4 x 15 reps", desc: "Trabajo metabólico de alta intensidad." },
                    { nombre: "Sentadilla Sumo con Mancuerna", series: "4 x 20 reps", desc: "Profundidad máxima manteniendo el talón fijo." }
                  ]
                }
              ];
            } else {
              bloquesGenerados = [
                {
                  bloque: "Viernes - Bloque 1: Glúteo Aislado & Abdomen",
                  ejercicios: [
                    { nombre: "Patada de Glúteo en Polea", series: "4 x 15 reps (p/pierna)", desc: "Extensión trasera controlada sin arquear la zona lumbar." },
                    { nombre: "Abducción de Cadera en Máquina", series: "4 x 20 reps", desc: "Sostén 1 segundo de apertura máxima lateral." },
                    { nombre: "Elevaciones de Piernas colgado", series: "4 x 15 reps", desc: "Control total del balanceo para aislar el abdomen." }
                  ]
                }
              ];
            }
          }

          setRutinaActual({
            titulo: `Programa Pro IA - ${g} (${d})`,
            bloques: bloquesGenerados
          });

          setLoading(false);
          setTab('entrenar');
        }, 400);
      };

      const formControlClass = "w-full p-3.5 rounded-2xl bg-[#f4f5f7] dark:bg-gray-800/60 border-none text-[13px] font-semibold text-gray-900 dark:text-gray-100 outline-none";
      const labelClass = "block text-[10px] font-extrabold text-[#6b7280] dark:text-gray-400 uppercase tracking-widest mb-1.5 ml-1";

      return (
        <div className="max-w-md mx-auto p-4 space-y-4">
          <header className="bg-white dark:bg-gray-900 rounded-[2rem] py-3.5 px-5 shadow-sm border border-gray-100/80 dark:border-gray-800 flex justify-between items-center">
            <div className="flex items-center space-x-3">
              <div className="w-9 h-9 bg-[#2b6ded] text-white font-black rounded-full flex items-center justify-center text-sm shadow-sm">🤖</div>
              <h1 className="text-[16px] font-black tracking-tight">FitAI <span className="text-[#2b6ded]">Pro Engine</span></h1>
            </div>
            <button onClick={() => setDarkMode(!darkMode)} className="w-9 h-9 bg-gray-50 dark:bg-gray-800 rounded-full flex items-center justify-center text-[15px]">
              {darkMode ? '☀️' : '🌙'}
            </button>
          </header>

          <nav className="bg-[#ecedf1] dark:bg-gray-800/60 p-1.5 rounded-2xl flex justify-between text-[11px] font-semibold">
            {['Generar', 'Entrenar', 'Social', 'Timer'].map(t => (
              <button 
                key={t}
                onClick={() => setTab(t.toLowerCase())}
                className={`flex-1 py-2 rounded-xl transition-all ${
                  tab === t.toLowerCase() 
                    ? 'bg-white dark:bg-gray-700 text-gray-900 dark:text-white shadow-sm font-bold' 
                    : 'text-[#6b7280] dark:text-gray-400'
                }`}
              >
                {t}
              </button>
            ))}
          </nav>

          <main className="space-y-4">
            {tab === 'generar' && (
              <form onSubmit={generarRutinaConIA} className="bg-white dark:bg-gray-900 rounded-[2rem] p-6 shadow-sm border border-gray-100/80 dark:border-gray-800 space-y-4">
                <div>
                  <h2 className="text-[20px] font-black">Motor IA Generativo</h2>
                  <p className="text-[12px] text-[#6b7280] mt-1">Selecciona cualquier día de la semana y género para ver la planificación profesional.</p>
                </div>

                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <label className={labelClass}>ATLETA</label>
                    <input type="text" value={formData.nombre} onChange={e=>setFormData({...formData, nombre: e.target.value})} className={formControlClass} />
                  </div>
                  <div>
                    <label className={labelClass}>GÉNERO</label>
                    <select value={formData.genero} onChange={e=>setFormData({...formData, genero: e.target.value})} className={formControlClass}>
                      <option>Hombre</option>
                      <option>Mujer</option>
                    </select>
                  </div>
                </div>

                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <label className={labelClass}>DÍA DE LA SEMANA</label>
                    <select value={formData.dia} onChange={e=>setFormData({...formData, dia: e.target.value})} className={formControlClass}>
                      <option>Lunes</option>
                      <option>Martes</option>
                      <option>Miércoles</option>
                      <option>Jueves</option>
                      <option>Viernes</option>
                    </select>
                  </div>
                  <div>
                    <label className={labelClass}>DESCANSO</label>
                    <select value={formData.descanso} onChange={e=>setFormData({...formData, descanso: e.target.value})} className={formControlClass}>
                      <option>90 segundos</option>
                      <option>60 segundos</option>
                    </select>
                  </div>
                </div>

                <button type="submit" disabled={loading} className="w-full py-4 rounded-[1.25rem] bg-gradient-to-r from-[#2b6ded] to-[#1442c2] text-white font-extrabold text-[11px] uppercase tracking-widest shadow-md">
                  {loading ? 'GENERANDO RUTINA...' : 'GENERAR RUTINA INTELIGENTE'}
                </button>
              </form>
            )}

            {tab === 'entrenar' && !sesionActiva && (
              <div className="space-y-4">
                <div className="bg-blue-600/10 border border-blue-500/20 p-4 rounded-2xl space-y-1">
                  <span className="text-[10px] font-black uppercase text-blue-600 dark:text-blue-400">Atleta: {formData.nombre} • {formData.genero}</span>
                  <h3 className="font-extrabold text-[15px]">{rutinaActual.titulo}</h3>
                  <p className="text-[11px] text-gray-500">Configuración aplicada con éxito</p>
                </div>

                {rutinaActual.bloques.map((bloque, bIdx) => (
                  <div key={bIdx} className="bg-white dark:bg-gray-900 rounded-[2rem] p-5 shadow-sm border border-gray-100/80 dark:border-gray-800 space-y-4">
                    <div className="flex justify-between items-center border-b border-gray-100 dark:border-gray-800 pb-3">
                      <h3 className="font-extrabold text-[14px] text-blue-600 dark:text-blue-400">{bloque.bloque}</h3>
                      <button onClick={() => setSesionActiva(bloque)} className="text-[11px] font-bold text-white bg-[#2b6ded] px-3.5 py-1.5 rounded-full shadow-sm">Iniciar Bloque</button>
                    </div>
                    <div className="space-y-3">
                      {bloque.ejercicios.map((ej, ejIdx) => (
                        <div key={ejIdx} className="bg-[#f7f8fa] dark:bg-gray-800/40 p-3.5 rounded-2xl space-y-1">
                          <div className="flex justify-between items-center">
                            <h4 className="font-bold text-[13px]">{ej.nombre}</h4>
                            <span className="text-[11px] font-black text-[#2b6ded]">{ej.series}</span>
                          </div>
                          <p className="text-[11px] text-gray-500">{ej.desc}</p>
                        </div>
                      ))}
                    </div>
                  </div>
                ))}
              </div>
            )}

            {tab === 'entrenar' && sesionActiva && (
              <div className="bg-white dark:bg-gray-900 rounded-[2rem] p-6 shadow-sm border border-gray-100/80 dark:border-gray-800 space-y-4">
                <h2 className="text-[18px] font-black">Entrenando: {sesionActiva.bloque}</h2>
                <p className="text-xs text-gray-500">Registra tus marcas y aplica las pautas técnicas.</p>
                <button onClick={() => setSesionActiva(null)} className="w-full py-3.5 bg-green-600 text-white font-extrabold text-[12px] rounded-2xl">
                  ✓ Completar Bloque
                </button>
              </div>
            )}

            {tab === 'social' && (
              <div className="bg-white dark:bg-gray-900 rounded-[2rem] p-6 shadow-sm border border-gray-100 dark:border-gray-800 space-y-3 text-center">
                <h3 className="text-[16px] font-black">Comunidad Pro Engine</h3>
                <p className="text-xs text-gray-500">Comparte tus entrenamientos generados.</p>
              </div>
            )}

            {tab === 'timer' && (
              <div className="bg-white dark:bg-gray-900 rounded-[2rem] p-8 shadow-sm border border-gray-100 dark:border-gray-800 text-center space-y-4">
                <span className="text-[10px] font-black text-[#2b6ded] uppercase">CRONÓMETRO</span>
                <div className="text-[64px] font-black leading-none">01:30</div>
                <button className="px-7 py-2.5 bg-[#306ee8] text-white font-bold text-[12px] rounded-xl">Iniciar Timer</button>
              </div>
            )}
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
